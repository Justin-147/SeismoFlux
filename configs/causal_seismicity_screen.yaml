mixtures:
  S1:
    formula: (1-alpha_R_fold)*S0 + alpha_R_fold*R
    alpha_id: alpha_R_fold
  SP:
    formula: (1-alpha_P_fold)*S0 + alpha_P_fold*RP
    alpha_id: alpha_P_fold
  weight_bounds_inclusive: [0.0, 1.0]
  one_weight_per_model_per_fold: true
  weight_shared_across_7_30_90_day_assessments: true
  weight_fit_rows: expanding_nonoverlapping_h007_fit_exposures_only
  fit_issue_map_rule: >-
    every_fit_event_is_assigned_to_the_unique_issue_T_with_T_less_than_origin_time
    _lte_T_plus_7d
  fit_predictor_history_rule: source_origin_time_and_available_at_lte_issue_T
  fit_target_availability_rule: available_at_lte_that_fold_fit_target_end_inclusive_utc
  fit_target_population: unique_supported_M5_6_events_only
  assessment_target_or_metric_use_for_weight: forbidden
  objective: sum_fit_event_log_mixture_spatial_density
  objective_formula: >-
    L_alpha_equals_sum_i_log_of_1_minus_alpha_times_q0_i_plus_alpha_times_qX_i
  objective_compensator_role: equal_constant_across_weights
  exact_solver:
    concavity_required: true
    first_derivative_formula: >-
      sum_i_qX_i_minus_q0_i_div_1_minus_alpha_times_q0_i_plus_alpha_times_qX_i
    second_derivative_formula: >-
      negative_sum_i_square_of_qX_i_minus_q0_i_div_square_of_mixture_density_i
    derivative_aggregation: >-
      math_fsum_in_origin_time_then_unsigned_UTF8_event_id_bytes_order_divided_by_event_count
    derivative_sign_tolerance: 1.0e-12
    concavity_positive_tolerance: 1.0e-12
    solver_precedence:
      - no_fit_events_evidence_insufficient
      - nonfinite_or_nonpositive_invalid
      - flat_alpha_0
      - derivative_at_zero_alpha_0
      - derivative_at_one_alpha_1
      - bisection
    derivative_endpoint_overlap_action: alpha_0_by_derivative_at_zero_precedence
    flat_rule: max_abs_qX_div_q0_minus_1_lte_1e_12
    if_derivative_at_zero_lte_positive_tolerance: 0.0
    if_derivative_at_one_gte_negative_tolerance: 1.0
    otherwise_bisection_iterations: 64
    bisection_update_if_midpoint_derivative_gt_zero: replace_left_endpoint
    bisection_update_otherwise: replace_right_endpoint
    bisection_return: arithmetic_mean_of_final_left_and_right_endpoints
    completely_flat_tie: 0.0
    stable_mixture_log_density:
      alpha_0: log_q0
      alpha_1: log_qX
      interior: numpy_logaddexp_log1p_minus_alpha_plus_log_q0_and_log_alpha_plus_log_qX
    density_floor_or_ratio_clipping: forbidden
    nonfinite_nonpositive_density_or_nonconcave_action: invalid
  grid_search_or_result_based_weight_choice: forbidden

