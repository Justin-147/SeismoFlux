    magnitude_interval: '[5.0,6.0)'
    deduplication_unit: event_id
    inside_study_area: true
    one_issue_membership_maximum_within_each_fold_horizon: true
    duplicate_issue_membership_action: invalid
  information_gain_target:
    population: base_target_and_inside_exact_fold4_supported_domain
    unsupported_target_event_log_action: excluded
    denominator: supported_unique_physical_event_count
  strict_recall_target:
    population: all_base_targets_in_full_study_area
    unsupported_target_action: included_in_denominator_and_forced_miss_for_all_models
    denominator: full_study_area_unique_physical_event_count
  M6_plus_role: descriptive_only_not_G1_T
  minimum_supported_IG_unique_physical_events_union: 20
  minimum_supported_IG_unique_events_each_fold_horizon: 1
  minimum_full_area_recall_unique_physical_events_union: 20
  minimum_full_area_recall_unique_events_each_fold_horizon: 1
  any_minimum_or_zero_event_failure_action: evidence_insufficient_no_partial_macro
  full_study_area_target_denominator: true
  outside_supported_domain_target_action: count_as_not_covered_in_strict_recall
  target_epicenter_use_for_grid_region_candidate_or_boundary_generation: forbidden

alarm_area:
  query_grid_cell_size_km: 25.0
  grid_origin_m: [0.0, 0.0]
  target_independent_grid_only: true
  primary_budget_km2: 600000.0
  mass_source: operational_12_5km_normalized_masses_aggregated_to_aligned_25km_parent
  area_source: exact_study_area_clipped_runtime_query_grid_cell_area
  rank_value: aggregated_integrated_cell_mass_divided_by_exact_study_area_clipped_cell_area
  descending_rank: true
  tie_break: [cell_row_ascending, cell_column_ascending, cell_id_ascending]
  selection: complete_prefix_with_cumulative_exact_area_lte_budget
  partial_cell_skip_oversized_cell_or_budget_expansion: forbidden
  same_grid_area_and_tie_rule_all_models: true

evaluation:
  cell_dimensions: fold_x_horizon
  cell_order:
    folds: [1, 2, 3]
    horizons_days: [7, 30, 90]
  information_gain:
    formula: >-
      paired_continuous_event_log_intensity_ratio_minus_independently_recomputed_paired
      _integrated_compensator_difference_per_supported_unique_physical_event
    event_density_operator: >-
      continuous_normalized_KDE_at_projected_event_coordinate_exactly_as_alpha_fit
    event_density_grid_lookup_interpolation_or_cell_average: forbidden
    shared_rate_log_term: cancels_but_positive_shared_rate_must_have_passed
    fold_horizon_compensator: sum_independently_recomputed_compensator_over_all_issue_dates
  strict_recall:
    formula: >-
      full_study_area_unique_target_hits_in_complete_600000km2_alarm_prefix_divided_by
      _full_study_area_unique_target_count
    unsupported_target_hit: forced_zero_all_models
  aggregation:
    fold_macro: arithmetic_mean_of_7_30_90_cells
    horizon_macro: arithmetic_mean_of_three_fold_cells_for_same_horizon
    overall_macro: arithmetic_mean_of_three_fold_macros
    each_fold_horizon_weight: 0.1111111111111111
    recall_uses_same_fold_then_overall_equal_weight_order: true
  confirmatory_contrasts:
    exact_order: [S1_minus_S0, S1_minus_SP]
    S1_minus_S0:
      practical_recall_gain_minimum_percentage_points: 5.0
    S1_minus_SP:
      practical_recall_gain_minimum_percentage_points: 0.0
  descriptive_contrasts:
    SP_minus_S0:
      role: interpretation_only_not_interval_family_or_pass_gate
  deterministic_control_permutation_p_value: forbidden

bootstrap:
  replications: 2000
  replicate_indices: 0_through_1999
  root_seed: 147
  generator: numpy.random.PCG64
  seed_namespace_utf8_exact: 'seismoflux|stage2s-causal-seismicity-development-v1|G1-T|paired-event-block-bootstrap|PCG64|root-seed=147|v1'
  entropy_uint128: unsigned_big_endian_integer_of_first_16_bytes_of_SHA256_seed_namespace
  generator_constructor: numpy.random.Generator_numpy.random.PCG64_entropy_uint128
  unit: deduplicated_physical_event_block_with_all_fold_horizon_memberships
  strata: fold_id_x_three_bit_7_30_90_horizon_membership_signature_x_supported_IG_bit
  horizon_membership_signature:
    text_order: b7_b30_b90
    binary_integer: int_of_concatenated_b7b30b90_base_2
    example_001: 90_day_only
  stratum_order: >-
    fold_index_ascending_then_membership_binary_integer_001_to_111_ascending_then
    _supported_bit_0_then_1
  event_order_within_stratum: origin_time_utc_ascending_then_unsigned_UTF8_event_id_bytes_ascending
  draw_order: each_replicate_then_each_nonempty_stratum_in_frozen_stratum_order
  empty_stratum_RNG_call: none
  one_draw: >-
    rng.integers_low_0_high_stratum_size_size_stratum_size_dtype_int64_endpoint_false
  sampling: with_replacement_within_stratum_preserving_each_stratum_size
  same_multiplicity_for_all_models_contrasts_IG_and_recall: true
  predictions_alarms_rates_and_weights_refit_inside_bootstrap: false
  sequence_component_count_and_event_resampling_unit_count_reported: true
  failed_replication_replacement_or_seed_change: forbidden
  failed_replication_action: invalid
  point_estimate_included_as_replication: false
  quantile:
    method: numpy_linear_frozen_explicitly
    sorted_values_zero_based: x_0_through_x_B_minus_1
    h: B_minus_1_times_p
    j: floor_h
    gamma: h_minus_j
    formula: one_minus_gamma_times_x_j_plus_gamma_times_x_j_plus_1
  interval_families:
    information_gain:
      members: [S1_minus_S0, S1_minus_SP]
      method: bonferroni_two_sided_percentile_familywise_95pct
      member_interval_coverage: 0.975
      lower_percentile: 1.25
      upper_percentile: 98.75
    fixed_area_recall:
      members: [S1_minus_S0, S1_minus_SP]
      method: bonferroni_two_sided_percentile_familywise_95pct
      member_interval_coverage: 0.975
      lower_percentile: 1.25
      upper_percentile: 98.75
  ordinary_marginal_95pct_interval_role: diagnostic_only
  interval_scope: >-
    conditional_on_fixed_calendar_observed_stratum_sizes_fitted_fold_models_and_weights
    _with_event_block_resampling_not_sequence_independence

regional_robustness:
  region_id_source: construction_zone_id_by_cell_id
  event_region_assignment: >-
    projected_event_coordinate_to_left_bottom_closed_right_top_open_frozen_25km_cell
    _then_frozen_zone_id
  contrasts_required: [S1_minus_S0, S1_minus_SP]
  sign_tolerance: 1.0e-12
  region_contribution_denominator: original_frozen_fold_horizon_denominator_no_renormalization
  information_gain_additive_region_cell_formula: >-
    G_z_fh_A_minus_B_equals_open_bracket_sum_e_in_E_z_fh_log_q_A_Te_div_q_B_Te
    _minus_sum_T_in_J_fh_open_paren_r_f_times_h_times_open_paren_M_A_T_z_minus_M_B_T_z
    _close_paren_close_paren_close_bracket_div_n_supported_fh
  recall_additive_region_cell_formula: >-
    full_area_hit_difference_sum_in_zone_divided_by_original_full_area_event_count
  macro_region_contribution: arithmetic_mean_of_nine_fold_horizon_additive_cell_contributions
  report_all_39_zones_including_zero_event_zones: true
  additive_closure_absolute_tolerance: 1.0e-10
  additive_closure_failure_status: invalid
  IG_event_bearing_zone: at_least_one_supported_IG_target_membership
  recall_event_bearing_zone: at_least_one_full_area_recall_target_membership
  minimum_IG_event_bearing_zones: 2
  minimum_recall_event_bearing_zones: 2
  minimum_positive_additive_IG_event_bearing_zones_each_contrast: 2
  minimum_positive_additive_recall_event_bearing_zones_each_contrast: 2
  positive_definition: event_bearing_AND_additive_contribution_gt_sign_tolerance
  strongest_positive_zone_each_contrast_each_metric:
    IG: maximum_additive_macro_IG_among_positive_IG_event_bearing_zones
    recall: maximum_additive_macro_recall_gain_among_positive_recall_event_bearing_zones
    tie_break: unsigned_UTF8_construction_zone_id_bytes_ascending
  leave_one_region_out:
    type: fixed_denominator_additive_residual
    model_weight_rate_density_alarm_mask_ranking_or_denominator_refit: forbidden
    residual_macro_IG: >-
      primary_macro_IG_contrast_minus_that_contrasts_strongest_IG_zone_additive_contribution
    residual_macro_recall_gain: >-
      primary_macro_recall_gain_contrast_minus_that_contrasts_strongest_recall_zone
      _additive_contribution
    residual_macro_IG_each_contrast_gt_sign_tolerance: true
    residual_macro_recall_gain_each_contrast_gt_sign_tolerance: true
  raw_target_event_to_region_binding_publication: forbidden

sequence_dominance_diagnostic:
  role: required_claim_scope_diagnostic_not_primary_pass_gate
  sequence_algorithm:
    population: unique_full_study_area_primary_M5_6_assessment_event_union
    graph_edge_if:
      absolute_origin_time_difference_seconds_lte: 2592000
      WGS84_geodesic_distance_m_lte: 75000.0
      conjunction: AND
    geodesic_implementation: pyproj.Geod_ellps_WGS84
    components: undirected_connected_components
    component_id: unsigned_UTF8_bytes_smallest_event_id
    event_order: [origin_time_utc_ascending, unsigned_UTF8_event_id_bytes_ascending]
    largest_count_tie_break: unsigned_UTF8_component_id_bytes_ascending
    largest_gain_tie_break: unsigned_UTF8_component_id_bytes_ascending
  retain_all_sequences_in_primary_analysis: true
  additive_statistics:
    contrasts: [S1_minus_S0, S1_minus_SP]
    IG_component: >-
      original_denominator_one_ninth_sum_of_supported_event_log_ratio_memberships
    recall_component: >-
      original_denominator_one_ninth_sum_of_full_area_event_hit_difference_memberships
    global_compensator_assignment: separate_unassigned_residual_not_attributed_to_any_sequence
    additive_closure: >-
      sum_sequence_event_components_plus_global_compensator_residual_equals_primary_macro
    sum_components_to_primary_macro_absolute_tolerance: 1.0e-10
    global_compensator_above_primary_1e_10_tolerance_or_closure_failure_status: invalid
  largest_gain_component_each_contrast_each_metric:
    IG: maximum_additive_IG_event_component
    recall: maximum_additive_recall_gain_component
    tie_break: unsigned_UTF8_component_id_bytes_ascending
  fraction_rules:
    event_fraction: component_unique_events_div_unique_union_events
    hit_fraction_by_model: >-
      component_additive_macro_hit_div_model_macro_recall_if_denominator_gt_1e_12_else_null
    IG_gain_fraction_each_contrast: >-
      component_additive_IG_div_macro_IG_if_macro_IG_gt_1e_12_else_null
    raw_values_always_reported: true
  leave_out:
    components:
      - largest_count_component
      - largest_IG_gain_component_each_contrast
      - largest_recall_gain_component_each_contrast
    method: >-
      primary_macro_including_independently_recomputed_global_compensator_residual_minus
      _selected_sequence_event_component_with_original_denominators
    refit_reweight_rerank_alarm_or_denominator_change: forbidden
  report:
    - sequence_component_count
    - event_resampling_unit_count
    - largest_sequence_event_fraction
    - largest_sequence_hit_fraction
    - largest_sequence_information_gain_fraction
    - leave_largest_count_sequence_out
    - leave_largest_gain_sequence_out
    - component_origin_time_span_days
    - component_max_pairwise_geodesic_distance_km
    - component_event_count
  if_any_required_contrast_residual_IG_or_recall_gain_lte_1e_12: >-
    claim_limited_to_sequence_associated_continuation_not_broad_regional_gain
  aftershock_or_cluster_deletion_from_primary_result: forbidden

catalog_latency_sensitivity:
  interpretation: predictor_feed_availability_delay_only
  simulated_additional_delay_days: [1, 7]
  run_each_delay_separately_and_require_both: true
  recent_window_as_of_rule: available_at_plus_delay_lte_T
  preceding_window_as_of_rule: available_at_plus_delay_lte_T_minus_30d
  origin_interval_boundaries_unchanged: true
  eligibility: intersection_of_fixed_origin_interval_and_delayed_availability_rule
  same_window_kernel_domain_solver_and_assessment_as_primary: true
  mixture_weights_refit_on_corresponding_delayed_fit_maps: true
  unchanged:
    - S0
    - assessment_targets_and_memberships
    - fold_calendar
    - support_domain
    - kernel_and_normalization
    - alarm_area_rule
    - primary_shared_r_M5_6_fold
  delayed_fit_targets: same_primary_fit_target_rows
  report_contrasts_each_delay: [S1_delay_minus_S0, S1_delay_minus_SP_delay]
  selecting_best_delay_or_combining_delays: forbidden
  interval_role: diagnostic
  threshold: 1.0e-12
  required_for_operational_robustness_each_delay_each_contrast:
    overall_macro_IG_point_gt_threshold: true
    fixed_600000km2_recall_gain_point_gt_threshold: true
  any_required_metric_lte_threshold_action: evidence_insufficient_fragile_signal_stop_route
  nonfinite_or_identity_failure_action: invalid

decision_gate:
  exact_status_order: [invalid, evidence_insufficient, failed, passed_development_signal]
  invalid_if:
    - future_or_assessment_leakage
    - source_hash_schema_support_grid_or_region_identity_failure
    - nonfinite_or_nonconvergent_density_or_weight
    - nonzero_global_compensator_difference_above_tolerance
    - different_target_rate_domain_grid_area_or_alarm_rule_across_models
    - target_derived_grid_region_boundary_parameter_or_candidate
    - cell_zone_mapping_unavailable_to_evaluator
    - continuous_density_operator_or_additive_identity_failure
    - grid_convergence_or_mass_closure_failure
  evidence_insufficient_if:
    - supported_IG_unique_physical_event_union_below_20
    - full_area_recall_unique_physical_event_union_below_20
    - any_fold_horizon_has_zero_supported_IG_or_full_area_recall_events
    - fewer_than_two_IG_or_recall_event_bearing_regions
    - zero_or_nonfinite_supported_fit_M5_6_rate
    - required_interval_undefined
    - latency_sensitivity_any_required_metric_lte_1e_12
  passed_development_signal_requires_all:
    - all_three_horizon_S1_minus_S0_IG_point_estimates_positive
    - all_three_horizon_S1_minus_SP_IG_point_estimates_positive
    - at_least_two_of_three_S1_minus_S0_fold_macros_positive
    - at_least_two_of_three_S1_minus_SP_fold_macros_positive
    - S1_minus_S0_fold_macro_median_positive
    - S1_minus_SP_fold_macro_median_positive
    - S1_minus_S0_overall_macro_IG_familywise_lower_gt_zero
    - S1_minus_SP_overall_macro_IG_familywise_lower_gt_zero
    - at_least_two_of_three_S1_minus_S0_fold_macro_recall_gains_positive
    - at_least_two_of_three_S1_minus_SP_fold_macro_recall_gains_positive
    - S1_minus_S0_fold_macro_recall_gain_median_positive
    - S1_minus_SP_fold_macro_recall_gain_median_positive
    - S1_minus_S0_fixed_600000km2_recall_gain_gte_5pp
    - S1_minus_S0_fixed_600000km2_recall_familywise_lower_gt_zero
    - S1_minus_SP_fixed_600000km2_recall_gain_gt_zero
    - S1_minus_SP_fixed_600000km2_recall_familywise_lower_gt_zero
    - both_contrasts_regional_additive_and_metric_specific_LORO_passed
    - both_delays_both_contrasts_IG_and_recall_gt_1e_12
  passed_claim: >-
    stage2s_alpha_time_causal_screen_on_reused_stage2r_development_period_for_one_30d
    _seismicity_increment_not_independent_not_globally_target_blind_not_locked_test
    _not_absolute_probability
  any_valid_evaluable_requirement_failure_status: failed
  S1_beats_S0_but_not_SP_interpretation: >-
    spatial_clustering_signal_without_proven_30d_freshness_then_stop_without_window_change
  SP_beats_S0_descriptive_interpretation: >-
    older_window_spatial_clustering_may_deserve_a_future_new_protocol_but_authorizes_no_retry
  neither_increment_beats_S0_interpretation: current_fixed_30d_increment_not_supported
  failure_scope: does_not_disprove_longer_timescale_or_full_Hawkes_but_route_still_stops
  result_based_30_60_90_365_day_exponential_or_random_lag_retry: forbidden

