scientific_question: >-
  Does adding one strictly causal spatial KDE of M4+ earthquakes from the most recent
  30 days to the frozen long-term 75 km KDE improve future M5_6 information gain and
  strict recall at 600000 km2 across three purged rolling folds, while also exceeding
  an otherwise identical model using the immediately preceding 30-day history?

