      - full_study_area_unique_M5_6_event_count
      - unique_target_cluster_count
      - all_required_forecast_densities_finite_positive
    false_reason_enum:
      - no_complete_exposure
      - truth_unavailable
      - zero_supported_denominator
      - zero_full_study_area_denominator
      - zero_target_cluster_denominator
      - invalid_forecast_density
      - formal_freeze_unavailable
      - scheduled_issue_cap_terminal_before_formal_freeze
    semantic_recomputation_required: true
    exposure_partition_identity: >-
      complete_exposure_count_equals_truth_available_complete_exposure_count
      _plus_selected_truth_snapshot_unavailable_count
    formal_freeze_unavailable_contract:
      target_blind_exposure_and_truth_availability_fields_remain_actual: true
      supported_full_and_cluster_counts: null
      all_required_forecast_densities_finite_positive: null
      evaluable: false
      attempted_freeze_failure_reason: formal_freeze_unavailable
      scheduled_issue_cap_reason: scheduled_issue_cap_terminal_before_formal_freeze
      zero_or_empty_target_substitution_for_unavailable_forbidden: true
  bootstrap:
    replications: 2000
    paired: true
    resampling_unit: target_cluster_connected_component
    generator: numpy.random.PCG64
    root_seed: 147
    generator_initialization_exact: numpy.random.Generator(numpy.random.PCG64(147))
    seed_namespace_role: identity_label_only_not_seed_derivation
    sampling: sample_target_clusters_with_replacement_same_cluster_count_as_observed
    complete_index_matrix_generated_and_frozen_before_effect_rows_open: true
    redraw_or_discard_replicates_forbidden: true
    every_replicate_all_three_supported_and_full_region_denominators_must_be_positive: true
