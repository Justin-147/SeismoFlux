schema_version: 1

protocol:
  protocol_version: '0.2.4'
  stage_id: Stage2P-1A
  experiment_id: stage2p-prospective-recent-seismicity-v1
  status: accepted
  protocol_tag: v0.2.4-prospective-seismicity-protocol
  code_tag: v0.2.4-prospective-seismicity-code
  execution_authorized: false
  real_issue_authorized: false
  stage2p1_protocol_frozen: true
  next_authorized_action: final_validation_commit_push_tag_readback_then_stage2p1b_synthetic_only
  real_catalog_read_authorized: false
  real_network_fetch_authorized: false
  locked_test_read_count: 0
  locked_test_run_count: 0
  locked_test_bypass_authorized: false
  protocol_and_code_tags_must_be_verified_remotely_before_real_issue: true
  target_cohort_remote_tag_receipts:
    remote_url: https://github.com/Justin-147/SeismoFlux.git
    remote_visibility: public
    annotated_tags_required: true
    protocol_tag_object_id_and_peeled_commit_required: true
    code_tag_object_id_and_peeled_commit_required: true
    verified_at_utc_and_exact_response_sha256_required: true
    receipt_sha256_required: true
    both_verified_before_valid_from_required: true
    peeled_commits_must_equal_cohort_protocol_and_code_commits: true
  target_cohort_code_manifest:
    structured_component_hashes_required: true
    manifest_sha256_required: true
    parser_normalization_dedup_revision_model_evaluation_visualization_and_validator_bound: true
    uv_lock_and_pyproject_sha256_bound: true
    issue_truth_revision_and_evaluation_records_must_exact_match: true

calendar:
  timezone: Asia/Shanghai
  issue_weekday: Thursday
  issue_local_time: '00:00:00'
  issue_utc_offset: '+08:00'
  issue_rule: weekly_Thursday_00_00_Asia_Shanghai
  first_issue_not_before_local: '2026-09-10T00:00:00+08:00'
  first_issue_not_before_utc: '2026-09-09T16:00:00Z'
  first_issue_derivation:
    valid_from_utc_is_derived_first_legal_issue_T: true
    formula: >-
      max_fixed_first_issue_not_before_utc_and_strict_next_rule_Thursday_T
      _after_max_protocol_and_code_remote_tag_receipt_verified_at_utc
    strict_next_rule_means_receipt_verified_at_must_be_lt_T: true
    first_IssueInputSnapshotRecord_issue_time_utc_must_equal_valid_from_utc: true
    if_pipeline_fails_at_derived_T_action: append_missed_issue_not_change_valid_from
    arbitrary_operator_delay_or_seasonal_start_selection_forbidden: true
    valid_from_change_after_TargetCohortDefinition_forbidden: true
  query_end_lag_minutes: 15
  query_end_rule: T_minus_15_minutes
  target_window_rule: '(T,T+h]'
  scheduled_issue_sequence:
    counts: every_rule_Thursday_including_missed_issue
    maximum: 130
    maximum_reached_before_104_on_time_action: evidence_insufficient_and_stop
  on_time_issue_sequence:
    counts: on_time_prediction_records_only
    maximum: 104
    missed_issue_value: null
  missed_issue_policy:
    any_fetch_freshness_seal_or_timestamp_failure: missed_issue
    prediction_install_or_publication_forbidden: true
    pre_candidate_failure_prediction_generated: false
    timestamp_failure_candidate_may_be_generated_before_T_minus_5: true
    timestamp_failure_candidate_must_remain_local_restricted_and_uninstalled: true
    backfill_forbidden: true
    historical_prediction_overwrite_forbidden: true

historical_baseline:
  source_id: earthquake_catalog_m3_plus
  role: frozen_local_history_before_comcat_cutover
  cutoff_utc: '2026-07-09T04:25:56Z'
  training_start_utc: '1970-01-01T00:00:00Z'
  raw_inventory_sha256: c6b817d48317d3228f6709cdcb77b934ccb80be99ae43fef25ef8fc0378f94bf
  normalized_local_path: data/processed/stage1/debc98054172a4a1/earthquake_event.parquet
  normalized_file_sha256: 2193514eec2889dbf4ae9598c5d45ef8961a8f3fcd26c7183b233dbe20842347
  normalized_content_sha256: 2005f0ec465978829d0832e7228f22ecd34f1a7e9f268598979de72a5295e404
  license_status: unknown_no_redistribution
  local_restricted: true
  immutable: true
  prospective_comcat_origin_rule: origin_time_utc_strictly_greater_than_cutover
  comcat_rows_at_or_before_cutover_forbidden: true

comcat:
  source_id: usgs_anss_comcat_fdsn_event_api_v1
  institution: United_States_Geological_Survey
  catalog: ANSS_ComCat
  api_standard: FDSN_event_web_service
  api_version: '1'
  endpoint: https://earthquake.usgs.gov/fdsnws/event/1/query
  count_endpoint: https://earthquake.usgs.gov/fdsnws/event/1/count
  method: GET
  response_format: geojson
  issue_input_role: prospective_increment
  truth_role: temporally_independent_mature_truth_acquisition_same_source
  credentials_forbidden: true
  transport:
    connect_timeout_seconds: 15
    total_timeout_seconds: 120
    redirects: forbidden
    maximum_response_bytes: 268435456
    user_agent_identity_sha256_required: true
    TLS_peer_certificate_chain_sha256_required: true
  license:
    status: USGS_authored_data_public_domain_with_non_USGS_partner_exceptions
    anss_data_and_products_policy_url: >-
      https://www.usgs.gov/media/files/anss-data-and-products-policy
    usgs_data_licensing_url: https://www.usgs.gov/data-management/data-licensing
    source_policy_identity_version_and_retrieved_at_required: true
    source_policy_exact_response_bytes_sha256_required: true
    cohort_license_policy_identity_sha256_required: true
    acquisition_license_identity_must_equal_cohort_license_policy_identity: true
    non_USGS_partner_content_requires_item_level_review: true
    raw_and_row_level_artifacts_remain_local_restricted: true
    uncertain_publication_rights_action: suppress_publication_but_allow_local_research
  exact_query:
    minlongitude: 73.446961
    minlatitude: 20.22909
    maxlongitude: 135.08583
    maxlatitude: 53.557926
    minmagnitude: 3.9
    eventtype: earthquake
    format: geojson
    orderby: time-asc
    limit: 20000
    includeallorigins: false
    includeallmagnitudes: false
    includedeleted: false
    includesuperseded: omit_not_applicable_without_eventid
    reviewstatus: omit_use_default_all
    offset: 1
    jsonerror: true
    nodata: 204
    catalog: omit
    contributor: omit
  request_identity:
    query_profile: stage2p_fdsn_query_url_v1
    count_profile: stage2p_fdsn_count_url_v1
    canonical_url_encoding: >-
      UTF8_RFC3986_percent_encoding_uppercase_hex_frozen_parameter_order_no_fragment
    exact_parameter_object_and_canonical_url_sha256_required: true
    semantic_recomputation_required: true
  count_preflight:
    format: geojson
    same_selection_parameters_as_query_required: true
    excluded_query_only_parameters:
      [orderby, limit, offset, includeallorigins, includeallmagnitudes]
    exact_request_and_response_bytes_sha256_required: true
    response_headers_sha256_required_on_response: true
    successful_200_content_type: application_json_or_parameterized_equivalent
    parsed_count_must_equal_response_count: true
    parsed_count_must_equal_attempt_and_acquisition_query_count: true
    count_gte_20000_action: do_not_issue_query_and_fail_closed
  bbox_order: [minlongitude, minlatitude, maxlongitude, maxlatitude]
  local_exact_polygon_filter_required: true
  bbox_only_membership_forbidden: true
  starttime_rule: API_inclusive_cutover_then_local_origin_strictly_greater_than_cutover
  endtime_rule_for_issue_input: API_inclusive_query_end_then_local_origin_lte_query_end
  query_profiles:
    issue_input:
      query_start_utc: frozen_cutover_utc
      query_end_utc: Q_equals_T_minus_15_minutes
      local_origin_window: '(cutover,Q]'
      source_role: prospective_increment
    mature_truth:
      query_start_utc: issue_T
      query_end_utc: T_plus_h
      local_origin_window: '(T,T+h]'
      source_role: temporally_independent_mature_truth
      issue_cutover_or_Q_window_reuse_forbidden: true
    formal_freeze_full_cohort:
      query_start_utc: minimum_selected_exposure_issue_T
      query_end_utc: maximum_selected_exposure_T_plus_h
      local_origin_window: '(global_target_start,global_target_end]'
      source_role: formal_freeze_full_cohort
      exactly_one_query_response: true
      all_exposure_windows_derived_locally_from_this_response: true
    truth_revision:
      remote_query_forbidden: true
      derivation_source: formal_freeze_full_cohort_single_response
  query_count_preflight_required: true
  query_count_gte_limit_action: fail_closed_without_dynamic_partition
  returned_feature_count_gte_limit_action: fail_closed_without_dynamic_partition
  dynamic_query_partitioning_forbidden: true
  allowed_success_http_statuses: [200, 204]
  http_204_semantics: legitimate_zero_event_success_with_empty_body_and_zero_rows
  captured_response_headers:
    - date
    - etag
    - last-modified
    - content-type
    - content-length
  successful_200_content_type: application_json_or_parameterized_equivalent
  successful_200_body: parseable_GeoJSON_FeatureCollection
  successful_200_geojson_parse_verified: true
  successful_204_body_byte_count: 0
  successful_204_query_count_feature_count_and_row_counts: 0
  successful_204_geojson_parse_verified: false
  missing_optional_header_action: record_null
  raw_response_bytes_sha256_and_count_required: true
  local_model_magnitude_eligibility: magnitude_gte_4.0
  local_truth_magnitude_filter: 5.0_lte_preferred_mag_lt_6.0
  normalization_schema_and_code_sha256_required: true
  deduplication_config_and_code_sha256_required: true
  normalized_and_deduplicated_rows_sha256_and_count_required: true
  first_seen:
    field: first_seen_at_utc
    rule: first_sealed_snapshot_fetch_completed_at_utc
    origin_time_as_first_seen_forbidden: true
    provider_updated_as_first_seen_forbidden: true
    backdating_forbidden: true
  deduplication:
    graph_nodes: preferred_feature_id_and_associated_ids
    graph_edge_rule: identifiers_cooccur_in_one_feature
    component_rule: connected_components
    same_identifier_revision_selection:
      primary: maximum_provider_updated
      tie_break: minimum_UTF8_raw_feature_bytes_sha256
    cutover_cross_source_rule:
      maximum_time_delta_seconds: 300
      maximum_distance_km: 50
      maximum_magnitude_delta: 0.5
      matched_anchor: frozen_local_baseline
      matched_comcat_event_counted_again: false
      candidate_pairs_require_all_three_thresholds: true
      missing_or_nonfinite_magnitude_action: not_a_candidate_pair
      distance_implementation: pyproj.Geod_ellps_WGS84
      distance_comparison_absolute_tolerance_m: 1.0e-6
      assignment_algorithm: deterministic_greedy_one_to_one
      candidate_order:
        - absolute_origin_time_delta_ascending
        - WGS84_geodesic_distance_ascending
        - absolute_magnitude_delta_ascending
        - unsigned_UTF8_comcat_event_id_ascending
        - unsigned_UTF8_local_event_id_ascending
      used_local_or_comcat_event_cannot_match_again: true
    policy_frozen_before_real_issue: true
  revision:
    issue_model_uses_only_version_available_in_that_issue_snapshot: true
    later_revision_backfill_into_prior_issue_forbidden: true
    prior_prediction_rewrite_forbidden: true
  coverage_diagnostics:
    recorded_for_interpretation: true
    arbitrary_China_M4_coverage_threshold_forbidden: true
    target_conditioned_source_switch_forbidden: true
    effect_conditioned_source_switch_or_threshold_change_forbidden: true
    http_200_or_schema_identity_alone_does_not_prove_scientific_continuity: true
    official_status_or_target_blind_evidence_confirmed_outage_product_change_or_partial_response:
      action: missed_issue_or_pause_before_effect_open
      evidence_identity_and_time_must_be_recorded: true
      backfill_forbidden: true

remote_timestamp:
  mechanism: RFC3161
  digest_algorithm: SHA256
  authority_order:
    - http://timestamp.digicert.com
    - http://timestamp.sectigo.com
  method: POST
  request_content_type: application/timestamp-query
  response_content_type: application/timestamp-reply
  request:
    message_imprint_digest: SHA256
    nonce_required: true
    certReq: true
  trusted_registry:
    profile: stage2p_timestamp_trust_registry_v1
    bootstrap:
      frozen_by_verified_protocol_tag_before_TargetCohortDefinition: true
      record_supplied_roots_policies_or_authority_mapping_forbidden: true
      cohort_fields_must_repeat_external_registry_constants: true
      future_rotation_requires_target_blind_new_protocol_tag_and_future_valid_from: true
    verification_level: offline_signature_path_to_protocol_pinned_anchor_without_revocation
    revocation:
      evaluated: false
      full_trust_chain_or_current_non_revocation_claim_forbidden: true
      residual_risk: signer_or_CA_revocation_after_pinned_protocol_release_is_not_detected
    token_contract:
      message_imprint_digest_oid: 2.16.840.1.101.3.4.2.1
      request_nonce_must_equal_TSTInfo_nonce: true
      certReq_must_be_true: true
      allowed_signed_data_digest_algorithm_oids:
        - 2.16.840.1.101.3.4.2.1
        - 2.16.840.1.101.3.4.2.2
      allowed_signer_signature_algorithm_oids:
        - 1.2.840.113549.1.1.1
      RSA_PSS_allowed: false
      signed_attributes_message_digest_and_content_type_required: true
      TSTInfo_content_type_oid: 1.2.840.113549.1.9.16.1.4
    certificate_path:
      token_must_embed_signer_and_intermediate_path_to_exact_pinned_anchor: true
      leaf_or_intermediate_certificate_pinning: false
      deterministic_path_selection: >-
        exact_issuer_subject_match_then_signature_verification_then_shortest
        _path_then_unsigned_DER_sha256_ascending
      every_certificate_valid_at_genTime: true
      signer_basicConstraints_CA_false_required: true
      signer_extendedKeyUsage_exactly_timeStamping_required: true
      signer_keyUsage_digitalSignature_required: true
      intermediate_basicConstraints_CA_true_required: true
      intermediate_keyUsage_keyCertSign_required: true
      anchor_exact_DER_sha256_required: true
    authorities:
      - attempt_index: 0
        authority_url: http://timestamp.digicert.com
        allowed_TSTInfo_policy_oids:
          - 2.16.840.1.114412.7.1
        pinned_anchor:
          subject: DigiCert_Trusted_Root_G4_cross_certificate
          DER_sha256: 33846b545a49c9be4903c60e01713c1bd4e4ef31ea65cd95d69e62794f30b941
          DER_base64: 
      - attempt_index: 1
        authority_url: http://timestamp.sectigo.com
        allowed_TSTInfo_policy_oids:
          - 1.3.6.1.4.1.6449.2.1.1
        pinned_anchor:
          subject: Sectigo_Public_Time_Stamping_Root_R46_cross_certificate
          DER_sha256: b53ac15cc1afb6e2ac06828f555bb3bf5bad8b2bac1733ce4cb7aafe729356de
          DER_base64: 
    registry_sha256: 28f1cb96182b7f2c731433157da80c86b99230d5e617bc2e8ce2fd5e99afbf56
  trusted_registry_identity:
    registry_sha256_rule: >-
      SHA256_of_seismoflux_canonical_json_v1_trusted_registry_excluding
      _exactly_registry_sha256
    trust_anchor_bundle_sha256_rule: >-
      SHA256_of_seismoflux_canonical_json_v1_authority_ordered_array_of
      _authority_url_plus_exact_pinned_anchor_object
    allowed_policy_oid_set_sha256_rule: >-
      SHA256_of_seismoflux_canonical_json_v1_authority_ordered_array_of
      _authority_url_plus_allowed_TSTInfo_policy_oids
    tsa_authority_identity_manifest_sha256_rule: >-
      SHA256_of_seismoflux_canonical_json_v1_exact_authorities_array
    expected:
      registry_sha256: 28f1cb96182b7f2c731433157da80c86b99230d5e617bc2e8ce2fd5e99afbf56
      trust_anchor_bundle_sha256: 3f56fba3d8e583cffc5d9e9f5201672ef8d86c1ea2f72c443fca8d0ce357abf9
      allowed_policy_oid_set_sha256: aeed57ffa0ec23462ba6c6687eac2c9e61f200d8c409d3fc681bcd82533bf68d
      tsa_authority_identity_manifest_sha256: 35f2ab134ecc6a9a258db79bfc9f941d3bc5c9fed2cc036a6d1a6056ca300022
  attempt_policy:
    every_attempt_recorded: true
    every_attempt_has_nonnull_attempt_completed_at_utc: true
    every_attempt_binds_attempt_preimage_sha256: true
    selection: first_offline_trust_path_valid_response_with_genTime_before_record_specific_deadline
    stop_after_first_valid: true
    all_authorities_failed_action: fail_closed_record_not_installed
  preimage_profile: stage2p_rfc3161_core_v1
  preimage: SHA256_of_seismoflux_canonical_json_v1_record_omitting_exactly_the_three_top_level_fields_timestamp_attempt_evidence_remote_timestamp_content_sha256
  nested_RFC3161_proof_or_token_fields_forbidden: true
  proof_preimage_sha256_must_equal_recomputed_record_core_sha256: true
  every_successful_record_attempt_preimage_must_equal_proof_preimage: true
  selected_response_sha256_must_equal_selected_attempt_response_sha256: true
  authority_and_trust_chain_identity_required: true
  verifier_implementation: >-
    python_cryptography_49_0_0_plus_asn1crypto_1_5_1_no_system_openssl_cli
  verification_code_sha256_bound_in_cohort: true
  trust_anchor_bundle_sha256_bound_in_cohort: true
  allowed_policy_oid_set_sha256_bound_in_cohort: true
  TSA_authority_identity_manifest_sha256_bound_in_cohort: true
  attachment_install_contract_sha256_bound_in_cohort: true
  attachment_paths:
    request: data/interim/stage2p/timestamp_attachments/{record_type}/{preimage_sha256}/{attempt_index:01d}.tsq
    response: data/interim/stage2p/timestamp_attachments/{record_type}/{preimage_sha256}/{attempt_index:01d}.tsr
    create_only_and_reopen_verify: true
  timestamp_token_bytes_sha256_required: true
  TSA_policy_OID_required: true
  timestamping_EKU_required: true
  message_imprint_must_equal_recomputed_preimage_sha256: true
  nonce_must_equal_request_nonce: true
  selected_attempt_position_and_response_sha256_must_match_proof: true
  second_authority_allowed_only_after_first_verifiable_failure: true
  all_attempt_time_order: >-
    record_core_frozen_at_utc_lte_request_started_at_utc_lte
    _attempt_completed_at_utc_lte_timestamp_deadline_utc
  response_attempt_completion_rule: >-
    response_received_at_utc_equals_attempt_completed_at_utc_for_every_response_outcome;
    network_failure_has_null_response_received_at_utc_and_nonnull_attempt_completed_at_utc
  authority_sequence_time_order: >-
    attempt_1_request_started_at_utc_gte_attempt_0_attempt_completed_at_utc
  deadline_and_attempt_checks_apply_when_remote_timestamp_is_null: true
  signed_time_must_be_before_record_specific_deadline: true
  record_specific_deadline_rule:
    TargetCohortDefinition: timestamp_deadline_utc_equals_valid_from_utc
    IssueInputSnapshotRecord: >-
      candidate_timestamp_deadline_utc_equals_issue_time_T_minus_5_minutes
    MatureTruthSnapshotRecord: >-
      timestamp_deadline_utc_equals_record_core_frozen_at_utc_plus_5_minutes
    TruthRevisionRecord: >-
      timestamp_deadline_utc_equals_record_core_frozen_at_utc_plus_5_minutes
    EvaluationFreezeRecord: >-
      timestamp_deadline_utc_equals_record_core_frozen_at_utc_plus_5_minutes
  selected_attempt_time_order: >-
    record_core_frozen_at_utc_lte_request_started_at_utc_lte_genTime_utc_lte
    _response_received_at_utc_equals_attempt_completed_at_utc_lte_timestamp_deadline_utc
  local_clock_alone_forbidden: true
  http_date_alone_forbidden: true
  git_author_or_committer_time_alone_forbidden: true
  invalid_or_unverifiable_issue_action: missed_issue_no_backfill
  missed_issue_audit:
    preimage_profile: stage2p_missed_audit_rfc3161_core_v1
    preimage: >-
      SHA256_of_seismoflux_canonical_json_v1_record_omitting_exactly_the_three
      _top_level_fields_missed_audit_timestamp_attempt_evidence
      _missed_audit_remote_timestamp_content_sha256
    candidate_deadline_rule: T_minus_5_minutes
    final_missed_record_core_freeze_deadline_rule: T_minus_4_minutes
    audit_timestamp_deadline_rule: issue_T
    selected_genTime_must_be_strictly_before_T: true
    audit_attempts_are_distinct_from_candidate_attempts: true
    audit_failure_action: scientific_continuity_pause_record_not_installed
    no_formal_issue_or_later_cohort_use_after_audit_failure: true

issue_input_snapshot:
  fetch_started_at_or_after_query_end_required: true
  fetch_completed_before_issue_T_required: true
  seal_completed_before_issue_T_required: true
  remote_timestamp_before_issue_T_required: true
  candidate_ready_or_failure_decision_deadline_rule: T_minus_5_minutes
  query_end_must_equal_T_minus_15_minutes: true
  stale_if_any_required_time_or_identity_check_fails: true
  previous_issue_record_sha256_required: true
  source_snapshot_and_prediction_seal_required_for_on_time: true
  missed_issue_installs_source_snapshot_or_prediction: false
  prediction_installed_true_only_for_on_time: true
  timestamp_failure_candidate_contract:
    failed_candidate_on_time_core_required: true
    candidate_profile: stage2p_failed_candidate_on_time_core_v1
    candidate_core_and_artifact_sha256_must_equal: true
    candidate_binds_issue_source_snapshot_prediction_seal_core_time_and_deadline_T_minus_5: true
    all_TSA_attempt_preimage_sha256_equal_candidate_core_sha256: true
    prediction_generated: true
    prediction_installed: false
    final_missed_record_core_is_audit_record_not_TSA_preimage: true
    candidate_core_bytes_create_only_local_restricted: true
  pre_candidate_failure_contract:
    failed_candidate_on_time_core: null
    timestamp_attempt_evidence: []
    prediction_generated: false
    prediction_installed: false
  missed_issue_records_all_fetch_and_RFC3161_attempt_evidence: true
  composite_snapshot:
    P0:
      historical_component: frozen_local_baseline_origin_lte_cutover
      prospective_component: comcat_origin_gt_cutover_and_lte_query_end
      available_and_first_seen_rule: strictly_before_issue_T
      rebuilt_each_issue: true
    R30:
      origin_window: '(query_end-30d,query_end]'
      exact_duration_days: 30
      origin_lte_T_required: true
      available_and_first_seen_rule: strictly_before_issue_T
      source: usgs_anss_comcat_fdsn_event_api_v1
    RP30:
      origin_window: '(query_end-60d,query_end-30d]'
      exact_duration_days: 30
      available_and_first_seen_rule: strictly_before_issue_T
      source: usgs_anss_comcat_fdsn_event_api_v1
  washout:
