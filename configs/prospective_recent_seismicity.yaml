    final_look_requires_all_90d_windows_mature: true
    final_checkpoint_if_sample_gate_fails: evidence_insufficient_and_stop
    intermediate_confirmatory_effect_display_or_testing_forbidden: true
    evaluation_freeze_required_before_effect_rows_open: true
    evaluation_record_phases: [input_freeze, result_seal]
    input_freeze_must_precede_effect_row_open: true
    input_freeze_selected_TSA_response_must_precede_effect_row_open: true
