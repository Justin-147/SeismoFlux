    formal_freeze_unavailable_generated_replication_count: 0
    formal_freeze_unavailable_zero_denominator_replication_count: null
    formal_freeze_unavailable_frozen_before_effect_rows_open: false
    accepted_replication_count_must_equal: 2000
    replicate_contribution_rule: >-
      duplicate_all_event_and_exposure_contributions_by_sampled_cluster_multiplicity
      _then_recompute_each_horizon_denominator_and_macro
    percentile_method: numpy_linear
    identity_namespace_utf8_exact: >-
      seismoflux|stage2p-prospective-recent-seismicity-v1|paired-target-cluster-bootstrap|PCG64|root-seed=147|v1
  simultaneous_inference:
    method: Bonferroni_two_sided_four_endpoint_family
    family_confidence_level: 0.95
    endpoint_count: 4
    lower_quantile: 0.00625
    upper_quantile: 0.99375
    endpoints:
      - P1_minus_P0_macro_information_gain
      - P1_minus_PP_macro_information_gain
      - P1_minus_P0_macro_recall_gain
      - P1_minus_PP_macro_recall_gain
  pass_gate:
    all_four_familywise_lower_bounds_gt_zero: true
