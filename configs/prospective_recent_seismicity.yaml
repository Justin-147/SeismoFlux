evaluation:
  alarm_area:
    target_budget_km2: 600000
    selection: complete_prefix_with_cumulative_exact_area_lte_budget
    rank_value: normalized_25km_cell_mass_divided_by_exact_clipped_cell_area
    tie_break: [cell_row_ascending, cell_column_ascending, cell_id_ascending]
    partial_cell_skip_oversized_cell_or_budget_expansion: forbidden
    actual_area_must_be_recorded: true
    ordered_full_ranking_sha256_required: true
    selected_complete_prefix_sha256_required: true
    selected_cell_count_required: true
    next_cell_would_exceed_budget_or_domain_exhausted_required: true
    next_unselected_rank_position_cell_id_exact_area_and_row_sha256_required: true
    maximum_complete_25km_cell_area_km2: 625.0
    maximum_pairwise_actual_alarm_area_difference_km2: 625.0
    same_grid_area_budget_and_tie_rule_all_models: true
  formal_exposures:
    selection: earliest_issue_greedy_nonoverlap_separately_within_each_horizon
    selection_inputs: on_time_status_issue_time_horizon_only
    zero_event_exposures_retained: true
    issue_archive_is_not_independent_trial_count: true
    selected_exposure_manifest_frozen_before_effect_rows_open: true
    selected_truth_snapshot_unavailable_action: no_replacement_horizon_not_evaluable
    event_count_hit_score_or_model_rank_dependent_replacement_forbidden: true
  sample_gate:
    horizon_union_minimum_unique_deduplicated_supported_M5_6_events: 20
    minimum_unique_target_clusters: 10
    every_horizon_must_be_evaluable: true
    evaluable_horizon_definition: >-
      at_least_one_scored_supported_unique_M5_6_event_complete_selected_exposures
      _and_no_selected_truth_snapshot_unavailable
    M6plus_never_counts_toward_gate: true
  information_gain:
    unit: natural_log_nats_per_supported_unique_M5_6_event
    event_density_operator: continuous_boundary_normalized_75km_KDE_at_projected_event_coordinate
    grid_lookup_interpolation_or_cell_average: forbidden
    target_scope: frozen_G1_LS_supported_targets_only
    common_rate_and_compensator: identical_across_P0_P1_PP_and_cancel_in_pairwise_contrast
    zero_or_nonfinite_density_action: evidence_insufficient
    per_horizon_estimator: sum_paired_event_log_density_ratio_divided_by_supported_unique_event_count
    numerical_summation: deterministic_float64_pairwise
    equality_absolute_tolerance: 1.0e-12
  strict_recall:
    target_scope: full_study_area_all_unique_M5_6_targets
    unsupported_target_action: common_not_hit_for_P0_P1_PP
    hit_rule: target_projected_25km_cell_is_in_complete_alarm_prefix
    per_horizon_estimator: unique_hits_divided_by_full_study_area_unique_target_count
    zero_denominator_action: horizon_not_evaluable
  macro_aggregation:
    horizons_days: [7, 30, 90]
    weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333333]
    rule: equal_weight_across_three_horizons
    order: compute_each_horizon_estimator_then_arithmetic_mean_three_horizons
  target_clusters:
    algorithm: connected_components
    temporal_link_days: 30
    spatial_link_km: 75
    temporal_link_threshold_seconds: 2592000
    temporal_link_operator: absolute_origin_time_difference_seconds_lte_2592000
    spatial_distance_implementation: pyproj.Geod_3_7_2_ellps_WGS84_inv_float64_distance_m
    spatial_link_threshold_m: 75000.0
    spatial_link_operator: geodesic_distance_m_lte_75000
    comparison_tolerance_m: 0.0
    link_rule: temporal_link_operator_and_spatial_link_operator
    transitive_closure: true
    isolated_event_is_singleton: true
    stable_order: earliest_origin_time_then_utf8_event_id
    component_id_rule: SHA256_of_stage2p_target_cluster_v1_NUL_seismoflux_canonical_json_v1_sorted_unique_member_event_ids
    graph_scope: >-
      one_graph_per_evaluation_input_freeze_over_the_unique_full_study_area
      _M5_6_event_union_of_all_selected_issues_and_all_three_horizons
    horizon_specific_or_issue_specific_reclustering_forbidden: true
    cluster_membership_is_evaluation_level_not_part_of_physical_truth_target_identity: true
    52_to_104_cluster_merges_do_not_create_TruthRevision: true
    evaluation_freeze_cluster_membership_artifact_required: true
    same_physical_event_all_issue_and_horizon_contributions_share_block: true
  horizon_evaluability:
    derived_not_operator_selected: true
    required_evidence:
