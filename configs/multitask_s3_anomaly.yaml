    required_evaluable_inner_blocks: 2
    fewer_inner_blocks_lambda: 10.0
    criterion_spatial: pooled_validation_event_conditional_NLL
    criterion_count: pooled_validation_issue_Poisson_NLL
    ties: largest_lambda_with_absolute_tolerance_1e-10
    fit_and_scaler_refit_inside_each_inner_training_only: true
    baseline_fallback_after_viewing_outer_scores: forbidden
    optimizer: single_start_L_BFGS_B
    maxiter: 2000
    ftol: 1.0e-10
    gtol: 1.0e-6
    restart_or_hyperparameter_expansion_after_failure: false
