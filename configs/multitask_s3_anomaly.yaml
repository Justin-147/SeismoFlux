    no_events_or_no_legal_training: beta_zero_with_explicit_untrainable_status
  count:
    variants: [T0, T0_CAL, T0_CAL_COV, T0_CAL_SNAP, T0_CAL_DYN]
    formula: 'mu_b = mu0_b*exp(a+beta*z_national); mu means expected count in the complete h-day window'
    objective: mean_per_issue_Ms5_plus_Poisson_NLL_plus_lambda_half_beta_norm_squared
    intercept_penalized: false
    intercept_only_formula: 'a=log(sum(y_Ms5plus)/sum(mu0_Ms5plus))'
    shared_multiplier_for_both_magnitude_bands: true
    learns_magnitude_distribution: false
    no_legal_training_or_all_zero_y_or_fit_failure: original_T0_and_explicit_status_not_finite_MLE
    outputs: [expected_count, poisson_model_probability_at_least_one]
    probability_claim: model_based_not_empirically_validated_absolute_probability
  selection:
