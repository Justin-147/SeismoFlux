models:
  family: generalized_loglinear_ridge
  spatial:
    variants: [CATALOG, R30_REFERENCE, CAT_COV, CAT_SNAP, CAT_DYN]
    formula: 'q_i = p0_i*exp(beta*z_i)/sum_c(p0_c*exp(beta*z_c))'
    objective: mean_per_Ms4_event_conditional_spatial_NLL_plus_lambda_half_beta_norm_squared
