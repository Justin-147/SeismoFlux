schema_version: 1
protocol_version: d1.0.0
stage: D1
status: preregistered_retrospective_development
authority:
  controlling_blueprint: "SEISMOFLUX_IMPLEMENTATION_HANDOFF.md#11-2026-07-31-科学路线重设当前执行权威"
  design_document: docs/d1_executable_scientific_contract.md
  water_level_manifest: data/manifests/d1_fold_water_level_manifest.json
  old_stage2p_and_stage4_gates_have_no_execution_authority: true

authorization:
  retrospective_development_scoring_authorized_only_after_d1_0_accept_commit_push: true
  real_prospective_issue_authorized: false
  locked_test_authorized: false
  locked_test_run: false
  tree_model_authorized: false
  neural_network_authorized: false

scientific_question:
  zh: 在相同报警面积和严格因果时间边界下，近期地震活动、报告覆盖、单期异常和动态异常能否提高未来独立M5至6震群的空间召回？
  result_classification: retrospective_development_only
  primary_horizon_days: 30
  primary_alarm_area_km2: 600000
  primary_target: independent_M5_6_cluster_representative

data:
  local_data_root_current_machine: D:/AIPred/SeismoFlux/data
  identity_is_file_hash_not_absolute_path: true
  catalog_manifest:
    path: data/manifests/data_catalog.json
    file_sha256: 0bd12b428d6395f5623ce343e0f52bd2f5edfa0529bc406c72a297430a136a50
    snapshot_id: debc98054172a4a1
  earthquake_event:
    path: data/processed/stage1/debc98054172a4a1/earthquake_event.parquet
    file_sha256: 2193514eec2889dbf4ae9598c5d45ef8961a8f3fcd26c7183b233dbe20842347
    row_count: 40898
    allowed_columns: [event_id, origin_time_utc, origin_time_local, available_at, longitude, latitude, magnitude, inside_study_area]
  anomaly_report_period:
    path: data/processed/stage1/debc98054172a4a1/anomaly_report_period.parquet
    file_sha256: aac44418994b6b99c633dcf536e452ad315439336bc580a13f719d95a069e176
    row_count: 205
    allowed_columns: [report_id, available_at]
  study_area:
    path: data/processed/china_mainland.geojson
    file_sha256: 5e5dcf012e080882161c95bf592a1ee39a0f0fdad7114bcff58d645aeb30bb02
  anomaly_features:
    path: data/processed/stage3/anomaly_history/anomaly-feature-bundle-de7547faa9f87541/anomaly_feature_store.parquet
    registry: data/manifests/anomaly_feature_registry.json
    registry_file_sha256: 65635e18ab94e5e114948a6a7a5d1533a665fee1f6f862abcc5498394f85ce00
    bundle_id: anomaly-feature-bundle-de7547faa9f87541
    bundle_identity_sha256: de7547faa9f87541c83f02788fa6e40111f753f232c511758540ba1794d9ce5d
    feature_store_file_sha256: cd383d52cbb85ebba0e495e58f6e3d50d350f952e5432d5cd21386f6224042ef
    state_history_path: data/processed/stage3/anomaly_history/anomaly-feature-bundle-de7547faa9f87541/anomaly_state_history.parquet
    state_history_file_sha256: d948d59851778ad4c73be398e521883520fdd87880b0604628986cee2cb2813a
    state_history_row_count: 166189
    snapshot_count: 205
    query_cell_count: 15697
    row_count: 3217885
    grid_source: accepted_stage3_query_grid_only
    stage4_grid_identity_substitution_forbidden: true
  spatial_strata:
    public_manifest: data/manifests/anomaly_increment_r2_spatial_strata.json
    public_manifest_content_sha256: 0e8e1af89b802522150c9ef3b46a1ffe0d440e51f69ce4a532a6e1540934b5d2
    target_independent_nonempty_zone_count: 39
    role: space_permutation_and_regional_diagnostic_only
    may_not_enter_model_features: true
    local_coordinate_artifacts_not_committed:
      cell_mapping: data/interim/stage4/anomaly_increment_r2/construction_zone_cell_mapping.parquet
      entity_mapping: data/interim/stage4/anomaly_increment_r2/construction_zone_entity_mapping.parquet
      zone_geometry: data/interim/stage4/anomaly_increment_r2/construction_zones.parquet
      connectors: data/interim/stage4/anomaly_increment_r2/construction_zone_connectors.json
    local_artifact_sha256:
      cell_mapping: 171a500de9f9dd475f2c37a5426debc7c6f2d34ddd418056729c39b27118108e
      entity_mapping: 49cd56ace13680c3465b0c128f7dd9823636f6f1db7a2f39a12d1235df532170
      zone_geometry: c1c54d390bd1553c8f75b10def4898e24deb919345dd9ca0a11a02d0ff80ba70
      connectors: 1f25120d9b9b15ec428efe97183179cebe1c3c5b0e022294dbf82f4c73e4e167
  not_used_in_d1:
    - human_forecast_fields
    - fault_attributes
    - long_term_hazard_snapshot
    - locked_test
    - previous_model_effect_scores

time:
  timezone: Asia/Shanghai
  issue_time: anomaly_report_period.available_at_converted_to_local
  prediction_source_rule: origin_time_lte_T_and_available_at_lte_T
  target_interval: (T,T+h]
  target_catalog_freeze_available_at_utc: '2026-07-09T04:25:56Z'
  target_catalog_rule: origin_time_in_target_interval_and_available_at_lte_catalog_freeze
  all_selected_assessment_T_plus_h_must_be_lte_target_catalog_freeze: true
  fit_issue_eligible_if: T_lte_outer_assessment_start_minus_90_days
  fit_30d_response_matures_by: outer_assessment_start_minus_60_days_or_earlier
  exposure_selection: earliest_actual_issue_then_earliest_T_gte_previous_T_plus_horizon_on_full_axis
  fit_30d_exposures_must_not_overlap: true
  assessment_exposures_must_not_overlap_within_each_horizon: true
  assessment_fold_membership_uses_issue_T_only: true
  target_may_mature_after_assessment_issue_interval_end: true
  target_fold_assignment: issue_exposure_that_generated_the_target
  folds:
    - {id: F1, assessment_start_local: '2023-07-01T00:00:00+08:00', assessment_end_exclusive_local: '2024-04-01T00:00:00+08:00'}
    - {id: F2, assessment_start_local: '2024-07-01T00:00:00+08:00', assessment_end_exclusive_local: '2025-04-01T00:00:00+08:00'}
    - {id: F3, assessment_start_local: '2025-07-01T00:00:00+08:00', assessment_end_exclusive_local: '2026-04-01T00:00:00+08:00'}

targets:
  fit_response:
    magnitude: M_gte_4
    horizon_days: 30
    unit: unique_event_count_in_25km_cell
    inside_study_area_required: true
    event_to_cell_mapping: frozen_25km_equal_area_high_side_half_open_then_covered_adjacent_fallback
  primary_assessment:
    magnitude_interval: '[5.0,6.0)'
    horizons_days: [30, 90]
    inside_study_area_required: true
  exploratory_assessment:
    magnitude: M_gte_6
    never_part_of_primary_gate: true
  clusters:
    universe: union_of_all_unique_M5_6_targets_from_both_30d_and_90d_assessments
    universe_frozen_before_any_model_score: true
    reason_for_shared_universe: represent_one_physical_sequence_consistently_across_horizons
    graph: undirected_connected_components
    edge_time_absolute_seconds_lte: 2592000
    edge_distance_WGS84_ellipsoid_metres_lte: 75000
    horizon_active_if: global_cluster_has_at_least_one_target_event_in_that_horizon
    horizon_representative: minimum_(origin_time_utc,event_id)_among_that_horizon_target_members
    representative_fold: fold_of_generating_issue_exposure
    representative_event_issue_and_fold_are_horizon_specific: true
    one_cluster_may_count_at_most_once_per_horizon: true
    strict_hit_uses_representative_location_only: true
    public_term: rule_based_independent_cluster_representative
  event_to_cell:
    crs: '+proj=aea +lat_1=25 +lat_2=47 +lat_0=0 +lon_0=105 +datum=WGS84 +units=m +no_defs +type=crs'
    cell_size_metres: 25000
    grid_origin_metres: [0, 0]
    boundary_rule: high_side_half_open_then_low_side_candidates_if_exact_grid_boundary
    geometry_predicate: exact_clipped_cell_covers_projected_event_point
    tie_order: [high_row_high_column, high_row_low_column, low_row_high_column, low_row_low_column]
    target_log_density: log_cell_probability_mass_minus_log_clipped_area_km2

backgrounds:
  B0:
    source_event_start_utc: '1970-01-01T00:00:00Z'
    source_magnitude: M_gte_4
    source_inside_study_area: true
    source_available_at_lte_issue: true
    kernel: equal_weight_isotropic_gaussian
    bandwidth_km: 75
    normalization_domain: frozen_full_study_area
    quadrature_km: [12.5, 25, 50]
    operational_grid_km: 25
    local_Mc_rule: local_incompleteness_may_flag_only_that_local_unit_and_may_not_raise_the_threshold_elsewhere
  R30:
    source_interval: (T-30d,T]
    source_magnitude: M_gte_4
    source_inside_study_area: true
    source_available_at_lte_issue: true
    kernel_and_domain_same_as_B0: true
    empty_window_fallback: exact_B0
    mixture: p_R=(1-alpha)*p_B0+alpha*p_recent
    alpha_candidates: [0.0, 0.25, 0.5, 0.75]

preprocessing:
  fit_on_outer_training_only: true
  source_transform:
    identity: identity_finite
    nonnegative: log1p
    signed_trajectory: asinh
  source_clip_quantiles: [0.005, 0.995]
  source_imputation: transformed_training_median
  source_standardization:
    center: training_median
    scale_fallback_order: [1.4826_times_MAD, IQR_div_1.349, population_SD, fixed_one_if_constant]
  group_formula: equal_weight_mean_of_direction_aligned_source_Z
  group_restandardize_with_same_training_only_rule: true
  zero_scale_group: coefficient_fixed_zero
  quality_codes_valid_flags_and_sample_counts_as_predictors: forbidden
  global_report_continuity: diagnostic_only_because_constant_across_space_within_issue

feature_groups:
  C1:
    label: local_reporting_relative_completeness
    role: coverage
    sources:
      - {column: gaussian_200km__current_to_trailing_station_reporting_coverage_proxy, transform: identity, sign: 1}
      - {column: gaussian_200km__current_to_trailing_measurement_reporting_coverage_proxy, transform: identity, sign: 1}
  C2:
    label: local_reporting_breadth
    role: coverage
    sources:
      - {column: gaussian_200km__distinct_reporting_station_count_reporting_coverage_proxy, transform: nonnegative, sign: 1}
      - {column: gaussian_200km__distinct_reporting_measurement_count_reporting_coverage_proxy, transform: nonnegative, sign: 1}
  S1:
    label: reliable_current_load
    role: snapshot
    sources:
      - {column: gaussian_200km__reliability_weighted_listed_count, transform: nonnegative, sign: 1}
  S2:
    label: first_seen_load
    role: snapshot
    sources:
      - {column: gaussian_200km__first_seen_weighted_count, transform: nonnegative, sign: 1}
  S3:
    label: not_continued_load
    role: snapshot
    direction_not_assumed: true
    sources:
      - {column: gaussian_200km__not_continued_weighted_count, transform: nonnegative, sign: 1}
  S4:
    label: discipline_diversity
    role: snapshot
    sources:
      - {column: gaussian_200km__discipline_shannon_normalized, transform: identity, sign: 1}
  S5:
    label: spatial_concentration
    role: snapshot
    sources:
      - {column: gaussian_200km__concentration, transform: identity, sign: 1}
  D1:
    label: current_load_momentum
    role: dynamic
    sources:
      - {column: radius_200km__listed_count__slope_13w_per_week, transform: signed_trajectory, sign: 1}
      - {column: radius_200km__listed_count__acceleration_4v13_per_week2, transform: signed_trajectory, sign: 1}
      - {column: radius_200km__listed_count__peak_drop_52w, transform: signed_trajectory, sign: -1}
  D2:
    label: first_seen_momentum
    role: dynamic
    sources:
      - {column: radius_200km__first_seen_count__slope_13w_per_week, transform: signed_trajectory, sign: 1}
      - {column: radius_200km__first_seen_count__acceleration_4v13_per_week2, transform: signed_trajectory, sign: 1}
      - {column: radius_200km__first_seen_count__peak_drop_52w, transform: signed_trajectory, sign: -1}

design_controls:
  count_as_scientific_groups: false
  included_automatically_when_any_parent_group_is_used: true
  coefficient_penalty_factor: 1.0
  MC1:
    parent_groups: [C1]
    formula: float(any_original_source_is_null)
    sources:
      - gaussian_200km__current_to_trailing_station_reporting_coverage_proxy
      - gaussian_200km__current_to_trailing_measurement_reporting_coverage_proxy
    transform: identity_binary
    standardization: none
  MS45:
    parent_groups: [S4, S5]
    formula: float(any_original_source_is_null)
    sources:
      - gaussian_200km__discipline_shannon_normalized
      - gaussian_200km__concentration
    transform: identity_binary
    standardization: none
  MD1:
    parent_groups: [D1]
    formula: original_null_source_count_div_3
    sources:
      - radius_200km__listed_count__slope_13w_per_week
      - radius_200km__listed_count__acceleration_4v13_per_week2
      - radius_200km__listed_count__peak_drop_52w
    transform: identity_fraction
    standardization: none
  MD2:
    parent_groups: [D2]
    formula: original_null_source_count_div_3
    sources:
      - radius_200km__first_seen_count__slope_13w_per_week
      - radius_200km__first_seen_count__acceleration_4v13_per_week2
      - radius_200km__first_seen_count__peak_drop_52w
    transform: identity_fraction
    standardization: none

diagnostic_only_features:
  C3_global_reporting_continuity:
    spatial_model_predictor: false
    reason: constant_across_cells_within_one_issue
    sources:
      - days_since_previous_actual_report_reporting_coverage_proxy
      - missing_expected_period_count_13w_reporting_coverage_proxy
      - missing_expected_period_count_52w_reporting_coverage_proxy
      - report_row_count_reporting_coverage_proxy

excluded_features_without_targets:
  - {column: gaussian_200km__multidisciplinary_entity_weighted_fraction, reason: all_non_null_values_equal_zero}
  - {column: gaussian_200km__diffusion_radius_km, reason: deterministic_duplicate_of_concentration}
  - {column: report_present_reporting_coverage_proxy, reason: all_values_equal_one}
  - {column: radius_200km__listed_count__surge_z_13w, reason: high_missingness_sensitivity_only}
  - {column: radius_200km__first_seen_count__surge_z_13w, reason: high_missingness_sensitivity_only}
  - {column: gaussian_200km__age_mean_days, reason: ambiguous_physical_direction_sensitivity_only}
  - {column: slope_4w_family, reason: algebraically_redundant_with_slope13_and_acceleration}

models:
  - {id: B0, base: B0, feature_groups: []}
  - {id: B0_R30, base: R30, feature_groups: []}
  - {id: B0_C, base: B0, feature_groups: [C1, C2]}
  - {id: B0_C_A_snapshot, base: B0, feature_groups: [C1, C2, S1, S2, S3, S4, S5]}
  - {id: B0_C_A_dynamic, base: B0, feature_groups: [C1, C2, S1, S2, S3, S4, S5, D1, D2]}
  - {id: B0_R30_C_A_dynamic, base: R30, feature_groups: [C1, C2, S1, S2, S3, S4, S5, D1, D2]}

model_semantics:
  A_dynamic_includes_A_snapshot: true

spatial_training:
  response: future_30d_M4plus_cell_count
  likelihood: per_issue_conditional_multinomial_equivalent_to_profiled_spatial_Poisson
  equation: log_p_tc=log_p_base_tc+X_tc_beta-logsumexp_c(log_p_base_tc+X_tc_beta)
  objective: negative_pooled_equal_event_mean_log_p_tc_plus_one_half_lambda_beta_squared
  temporal_rate_and_issue_intercepts: profiled_out_not_fitted
  issue_with_zero_future_M4plus: contributes_no_spatial_likelihood
  event_weight: equal_across_all_outer_fit_M4plus_events
  feature_coefficients: ridge_penalized_equal_factor
  cell_area_role: already_inside_base_probability_mass_and_not_multiplied_twice
  spatial_prediction: exp_log_p_tc_normalized_over_all_positive_area_cells
  ridge_candidates: [0.1, 1.0, 10.0]
  optimizer: scipy_L-BFGS-B_float64_zero_start
  max_iterations: 2000
  ftol: 1.0e-10
  gtol: 1.0e-6
  arbitrary_epsilon_or_prediction_clipping: forbidden
  nonfinite_or_nonconverged_action: invalid_run_fix_minimum_implementation_then_rerun_same_contract

inner_selection:
  validation_issues: last_max_of_3_or_ceil_one_third_of_outer_fit_30d_issues
  each_validation_issue_training: all_earlier_selected_fit_30d_issues_only
  preprocessor_refit_on_each_inner_training_prefix: true
  alpha_selected_per_outer_fold: true
  alpha_selected_on_background_only_B0_vs_B0_R30: true
  alpha_reused_by_all_R30_based_models_in_same_outer_fold: true
  alpha_score: pooled_equal_event_mean_log_predicted_cell_density_on_inner_M4plus_targets
  alpha_tie_tolerance_nats_per_event: 1.0e-12
  alpha_tie_rule: smaller_alpha
  ridge_selected_per_outer_fold_and_feature_model: true
  ridge_score: pooled_equal_event_mean_log_predicted_cell_density_on_inner_M4plus_targets
  ridge_tie_tolerance_nats_per_event: 1.0e-12
  ridge_tie_rule: larger_penalty
  outer_M5_6_targets_may_not_select_any_parameter: true
  selected_parameters_refit_on_all_outer_fit_issues_before_assessment: true
  fewer_than_10_inner_M4plus_targets_fallback: {alpha: 0.0, ridge: 10.0, status: evidence_insufficient_for_tuning}

alarm_and_evaluation:
  area_budgets_km2: [300000, 450000, 600000, 750000, 960000]
  rank_key: descending_cell_probability_mass_div_clipped_area_then_row_column_cell_id_ascending
  select_complete_cells_only: true
  accumulated_area_may_not_exceed_budget: true
  overflow_rule: stop_at_first_overflow_and_do_not_skip_to_later_cells
  actual_selected_area_must_be_reported: true
  primary_metric: pooled_30d_rule_based_cluster_representative_recall_at_600000km2
  co_primary_efficiency: minimum_preregistered_area_reaching_B0_30d_pooled_recall_at_600000km2
  co_primary_unreachable_action: unreachable_not_zero
  secondary:
    - 90d_independent_cluster_recall
    - recall_area_curve
    - Molchan_curve
    - mean_spatial_log_density_gain_on_cluster_representatives
    - equal_weight_fold_macro
    - regional_direction_descriptive_only
    - leave_one_cluster_out_direction_descriptive_only
  no_target_action: evidence_insufficient_not_zero
  outside_support_target_action: counted_in_full_study_area_denominator_and_forced_miss
  zero_or_nonfinite_density_action: invalid_run_no_epsilon
  all_six_models_and_all_folds_must_be_reported: true

uncertainty:
  bootstrap_replications: 2000
  generator: numpy.random.PCG64
  root_seed: 147
  block: pooled_global_rule_based_cluster_id
  resample_each_horizon_active_cluster_set_separately: true
  draw_count_equals_active_cluster_count_in_that_horizon: true
  draw_with_replacement_from_cluster_ids_sorted_ascending: true
  paired_across_models_and_budgets_within_horizon: true
  random_stream_derivation: numpy_SeedSequence_[147,purpose_code,horizon_code,replication]
  random_stream_codes: {purpose_bootstrap: 1, horizon_30d: 30, horizon_90d: 90}
  replication_index_base: 0
  effect: candidate_recall_minus_B0_recall
  confidence_interval: percentile_2.5_97.5_numpy_linear
  probability_gain_positive: fraction_of_replicates_with_effect_strictly_gt_zero
  model_refit_in_bootstrap: false
  interpretation: conditional_on_fitted_models_and_observed_clusters

placebos:
  replications_each: 200
  generator: numpy.random.PCG64
  root_seed: 147
  random_stream_derivation: numpy_SeedSequence_[147,purpose_code,fold_code,replication]
  random_stream_codes: {purpose_time: 2, purpose_space: 3, fold_F1: 1, fold_F2: 2, fold_F3: 3}
  replication_index_base: 0
  canonical_iteration_order: fold_then_issue_then_zone_then_entity_or_cell_id_ascending
  observed_anomaly_statistics:
    - B0_C_A_snapshot_minus_B0_C
    - B0_C_A_dynamic_minus_B0_C
    - B0_C_A_dynamic_minus_B0_C_A_snapshot
  primary_statistic: pooled_30d_cluster_recall_difference_at_600000km2
  time:
    full_rebuild_axis: all_205_actual_report_periods_in_chronological_order
    nonscored_intermediate_report_periods_retained: true
    prehistory_rule: retain_all_available_periods_before_first_scored_issue_including_up_to_52w_warmup
    recipient_issue_calendar_and_coverage_fixed: true
    fit_and_post_fit_complete_report_axes_per_outer_fold_permuted_separately_at_fit_cutoff: true
    donor_mapping: uniform_random_permutation_without_replacement_fixed_points_allowed
    donor_snapshot_fields_moved_jointly: [S1, S2, S3, S4, S5]
    donor_base_series_moved_jointly: [radius_200km__listed_count, radius_200km__first_seen_count]
    precomputed_dynamic_columns_may_not_move: true
    D1_and_D2_rebuilt_from_destination_pseudo_history: true
    original_null_state_and_reason_codes_move_with_donor_raw_values: true
  space:
    unit: anomaly_entity_coordinate_pair_within_issue_and_target_independent_zone
    donor_mapping: uniform_random_coordinate_bijection_within_each_unit_fixed_points_allowed
    noncoordinate_payload_fixed: true
    coordinate_multiset_preserved_within_issue_zone: true
    coverage_fixed: true
    snapshot_and_dynamic_rebuilt_at_200km: true
  preprocessing_and_model_refit_each_replication: true
  alpha_and_ridge_inner_selection_rerun_each_replication: true
  background_targets_and_issue_calendar_fixed: true
  p_value: (1+count_null_gte_observed)/(replications+1)
  mechanism_promising_if_observed_exceeds_fraction_of_null: 0.80
  placebo_is_attribution_check_not_whole_model_kill_switch: true
  failure_fraction_max: 0.05
  failed_scientific_replication_counts_as_null_gte_observed: true
  above_failure_fraction_action: evidence_insufficient

evidence_levels:
  strong:
    conditions: [at_least_2_more_pooled_clusters, P_gain_gt_0_gte_0.90, no_fold_loses_more_than_1_cluster]
  promising:
    conditions_any:
      - [at_least_1_more_pooled_cluster, P_gain_gt_0_gte_0.80, at_least_2_of_3_folds_nonworse]
      - [same_cluster_hits, at_least_one_preregistered_area_step_less]
  weak:
    conditions: [positive_direction_but_insufficient_or_fold_mixed, no_clear_harm]
    allowed_next_action: one_preregistered_100km_or_300km_scale_or_penalty_sensitivity_then_prospective_or_stop
  none_or_harmful:
    conditions_any: [no_more_hits_and_no_area_saving, placebo_indistinguishable, single_region_or_cluster_dominance]
  five_percentage_points_is_strong_evidence_not_the_only_continuation_gate: true
  automatic_levels: [strong, promising]
  weak_none_harmful_require_reported_scientific_interpretation: true
  regional_and_leave_one_cluster_diagnostics_may_not_silently_override_promising_rule: true

visualization:
  static_issue_per_fold: chronologically_lower_middle_selected_30d_assessment_issue
  best_intermediate_model_map_rule: highest_pooled_600000km2_recall_then_smaller_equal_recall_area_then_fixed_model_order
  best_intermediate_model_candidate_order: [B0_R30, B0_C, B0_C_A_snapshot, B0_C_A_dynamic]
  required_static:
    - B0_best_intermediate_complete_combination_equal_area_maps
    - alarm_area_and_matured_target_overlay
    - recall_area_and_Molchan_curves
    - fold_effects_and_uncertainty
    - component_contribution
    - deterministic_hit_and_miss_examples
  case_selection: earliest_cluster_representative_in_each_hit_or_miss_class
  required_offline_interactive_controls: [issue, model, horizon, area_budget]
  retrospective_label_required: true
  relative_strength_may_not_be_called_probability: true
  all_model_metrics_visible_even_when_one_map_is_selected: true

recovery:
  default_workers: 4
  reserve_physical_cores: 2
  BLAS_OMP_threads_per_worker: 1
  gpu: optional_only_after_float64_equivalence_and_may_not_change_science
  checkpoint_unit: one_outer_fold_model_or_25_placebo_replications
  state_fields: [contract_sha256, input_sha256, git_commit, fold, model, placebo_kind, last_replication, completed_units, status]
  statuses: [prepared, running, invalid_run, completed]
  resume_only_when_contract_and_input_hashes_match: true
  invalid_run_before_valid_scores_may_rerun_same_contract_after_minimum_fix: true
  never_select_best_of_multiple_retries: true
  locked_test_remains_single_use: true

prospective_P1_0:
  current_real_issue_authorized: false
  positive_authorization_requires:
    - selected_model_formula_and_parameters
    - first_issue_T_and_data_cutoff_Q
    - valid_from
    - data_source_and_failure_rule
    - alarm_area_and_tie_rule
    - immutable_prediction_archive
    - 30d_and_90d_evaluation_checkpoints
    - accepted_commit_push_and_remote_verification
  authorization_record_must_explicitly_set_real_issue_authorized_true: true
