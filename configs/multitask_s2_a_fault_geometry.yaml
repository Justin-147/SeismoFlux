calendar:
  outer_folds: [C_DEV_2000_2004, C_DEV_2005_2009, C_DEV_2010_2014, C_DEV_2015_2019]
  horizons_days: [7, 30, 90, 180, 365]
  outer_issue_counts_per_horizon: [176, 116, 56, 32, 16]
  outer_total_issue_horizon_pairs: 396
  inner_blocks: exactly_I1_I2_I3_from_parent_contract
  forecast_axis: Thursday_00_00_Asia_Shanghai
  catalog_delay_hours: 24
  target_interval: '(issue,issue+horizon]'
  exposure_rule: unchanged_nonoverlapping_horizon_plus_30d_from_S1
  outer_embargo_days: 30

geometry_math:
  source_crs_assumption: EPSG_4326_WGS84_existing_interpretation_not_independently_confirmed
  projected_crs: existing_China_Albers_equal_area
  query_points: existing_clipped_cell_point_on_surface_not_new_centers
  distance: minimum_projected_Euclidean_point_to_LineString_distance_in_km
  duplicate_lines: retain_minimum_distance_is_duplicate_invariant
  proximity: 'q_s(i)=1/(1+(d_i/s)^2)'
  power: 2.0
  scales_km: [25.0, 75.0, 150.0]
  scale_meaning: half_proximity_distance_not_rupture_radius_or_hit_tolerance
  scale_tie_order_km: [75.0, 150.0, 25.0]
  normalized_cell_mass: 'F_s(i)=q_s(i)*A_i/sum_j(q_s(j)*A_j)'
  coarse_cell_mass: 'Fcoarse_s(i)=sum_j_in_block_i(F_s(j))*A_i/sum_j_in_block_i(A_j)'
  coarse_control: preserves_each_frozen_block_mass_removes_within_block_fault_detail
  coarse_control_is_formal_permutation_or_transfer_test: false
  pure_fault_scale_alarm_ranking: identical_for_same_source_scales_change_density_not_rank
  mixture: '(1-alpha)*C+alpha*F_or_Fcoarse'
  alpha_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]
  unique_mixture_candidates_per_source_and_representation: 13
  alpha_zero: one_exact_catalog_candidate_scale_null
  mixture_tie_order: smaller_alpha_then_scale_tie_order
  numerical_representation: finite_float64_normalized_log_cell_mass
  interpretation: relative_spatial_mass_not_absolute_occurrence_probability

models:
  S2A_SIMPLE_FAULT_ONLY: {source: SIMPLE, representation: fine, family: fault_only}
  S2A_SIMPLE_CATALOG_MIX: {source: SIMPLE, representation: fine, family: catalog_mixture}
  S2A_SIMPLE_COARSE_MIX: {source: SIMPLE, representation: coarse, family: catalog_mixture}
  S2A_TRACE_FAULT_ONLY: {source: TRACE, representation: fine, family: fault_only}
  S2A_TRACE_CATALOG_MIX: {source: TRACE, representation: fine, family: catalog_mixture}
  S2A_TRACE_COARSE_MIX: {source: TRACE, representation: coarse, family: catalog_mixture}

