geometry_math:
  source_crs_assumption: EPSG_4326_WGS84_existing_interpretation_not_independently_confirmed
  projected_crs: existing_China_Albers_equal_area
  query_points: existing_clipped_cell_point_on_surface_not_new_centers
  distance_units: km
  kernel: 'K_s(r)=exp(-r^2/(2*s^2))/(2*pi*s^2)'
  line_integral: 'q_s(x_i)=sum_j_in_panel(v_j*integral_over_L_j(K_s(norm(x_i-u))*d_length))'
  normalized_cell_mass: 'F_s(i)=A_i*q_s(x_i)/sum_k(A_k*q_s(x_k))'
  line_contribution: proportional_to_projected_length_times_original_rate_or_unit_weight
  per_line_unit_mass_normalization: false
  raw_lines: preserve_original_projected_edges_no_auto_merging_or_redrawing
  layer_support_selection: rate_nonnull_only_not_earthquake_coordinates_or_results
  target_or_grid_filtering_by_layer_support: false
  scales_km: [25.0, 75.0, 150.0]
  scale_meaning: Gaussian_standard_deviation_not_rupture_radius_or_hit_tolerance
  scale_tie_order_km: [75.0, 150.0, 25.0]
  mixture: '(1-alpha)*C+alpha*F'
  alpha_candidates: [0.0, 0.25, 0.5, 0.75, 1.0]
  unique_mixture_candidates_per_layer: 13
  alpha_zero: one_exact_catalog_candidate_scale_null
  mixture_tie_order: smaller_alpha_then_scale_tie_order
  numerical_representation: finite_float64_normalized_log_cell_mass
  Gaussian_tail_truncation_radius_km: null
  artificial_probability_floor: null
  additional_background_weight: null
  interpretation: relative_spatial_mass_not_absolute_occurrence_probability_or_moment_rate

numerical_integration:
  method: midpoint_quadrature_on_each_original_projected_straight_edge
  subinterval_count: 'ceil(edge_length_km/maximum_step_km)'
  quadrature_point_weight: represented_edge_length_km_times_layer_weight
  zero_length_edges: zero_contribution
  same_panel_layers_share_quadrature_points: true
  production_maximum_step_km: 3.125
  diagnostic_maximum_step_km: 6.25
  diagnostic_runs: 1
  diagnostic_uses_earthquake_targets: false
  diagnostic_metrics: [normalized_layer_total_variation, alarm_cell_differences_at_fixed_budgets]
  production_always_uses_fine_step: true
  step_selected_by_outer_results: false
  repeated_adaptive_refinement: false
  national_percentage_agreement_gate: null

models:
