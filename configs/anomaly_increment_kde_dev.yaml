    each_fold_horizon_miss_rate: >-
      one_minus_strict_recall_over_all_unique_physical_targets_in_that_fold_horizon
    unsupported_targets: counted_as_misses
    each_fold_horizon_alarm_fraction: >-
      sum_over_selected_issue_exposures(actual_selected_area_km2_times_horizon_duration)/
