    - local_paths
  retrospective_must_be_labeled_historical_not_prospective: true
  static_science_summary_schema: same_required_scientific_fields_as_public_aggregate_results
  plain_language_data_and_model_flow_required_content:
    - frozen_75km_spatial_KDE_uses_history_only_through_2019_12_31
    - each_fold_rate_head_uses_only_earthquakes_in_its_prior_training_exposures
    - assessment_M5_6_earthquakes_are_used_only_for_scoring_and_hit_miss
    - 205_causal_anomaly_snapshots_and_3217885_feature_rows
    - source_library_totals_are_not_the_attempt_sample_size
    - per_fold_actual_used_snapshot_and_feature_row_counts_with_future_or_validation_holdout_reasons
    - reporting_coverage_controls
    - M5_6_equals_5p0_lte_M_lt_6p0
    - three_rolling_folds_x_7_30_90_day_horizons
    - B0_to_C0_to_B1_to_B2_component_flow
    - human_prediction_location_magnitude_time_and_free_text_forbidden
  all_stage4a_pages_watermark: research_development_not_operational_warning
  prospective_forecasts_append_only_no_backfill_or_overwrite: true
