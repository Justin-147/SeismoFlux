randomness:
  root_seed: 147
  generator: numpy.random.PCG64
  derivation: sha256_canonical_context_first_16_bytes_big_endian_entropy
  namespace: stage4-kde-development-v1
  canonical_context_serialization: utf8_json_sorted_keys_compact_no_nan
  canonical_context_fields:
    - root_seed_decimal
    - schema_version
    - protocol_version
    - namespace
    - frozen_input_seal_sha256
    - purpose
    - fold_or_joint
    - partition_role
    - replication_index
  candidate_comparator_horizon_and_metric_are_not_seed_fields: true
  root_seed_is_included_as_canonical_context_field: true
  pairing_scope: same_replication_across_variants_folds_horizons_and_metrics
  worker_count_invariant: true
  old_r2_randomness_manifest_reused: false
  code_freeze_randomness_manifest:
    path: data/manifests/anomaly_increment_kde_dev_randomness.json
    required_before_real_input_or_target_read: true
  bootstrap:
    replications: 2000
    population: all_unique_M5_6_physical_event_ids_in_three_fold_three_horizon_union
    unit: deduplicated_physical_event_block_with_all_candidate_comparator_contributions
    strata: fold_id_x_three_bit_7_30_90_horizon_membership_signature
    sampling: with_replacement_within_each_stratum_same_stratum_sample_size
    total_sample_size_each_replication: unchanged_unique_event_union_size
    fold_horizon_marginal_event_counts_each_replication: preserved_exactly
    same_multiplicity_vector_for_all_variants_comparators_and_metrics: true
    singleton_stratum_action: deterministic_self_draw
    zero_event_fold_horizon_replication_action: impossible_by_contract_otherwise_invalid
    original_event_to_fold_and_horizon_membership_is_frozen_before_resampling: true
    intervals:
      marginal_percentile_95: required_diagnostic_not_gate
      confirmatory_familywise_simultaneous:
        method: bonferroni_two_sided_percentile
        separate_endpoint_families:
          overall_macro_information_gain:
            - B1_minus_B0
            - B1_minus_C0
            - B2_minus_B0
            - B2_minus_C0
          fixed_600000km2_recall_gain:
            - B1_minus_B0
            - B1_minus_C0
            - B2_minus_B0
            - B2_minus_C0
        familywise_confidence_level: 0.95
        comparisons_per_family: 4
        component_two_sided_confidence_level: 0.9875
        lower_percentile: 0.00625
        upper_percentile: 0.99375
        same_paired_replications_for_all_family_members: true
        gate_uses_simultaneous_lower_bounds_not_marginal_bounds: true
    failed_replication_action: evidence_insufficient_no_drop_or_replacement
  time_permutation:
    replications: 1000
    mapping: issue_to_issue_bijection_separate_within_fit_and_assessment_pools
    coverage_and_background_fixed: true
    snapshot_scientific_values_and_missingness_moved_together: true
    trajectory_recomputed_from_pseudo_history: true
    anomaly_coefficients_refit_each_replication: true
  space_permutation:
    replications: 1000
    mapping: entity_coordinate_pair_bijection_within_frozen_target_blind_strata
    coverage_background_and_noncoordinate_attributes_fixed: true
    snapshot_and_trajectory_recomputed_at_200km: true
    anomaly_coefficients_refit_each_replication: true
  monte_carlo_p_value: '(1 + count(null >= observed)) / (replications + 1)'
  maximum_failed_replication_fraction: 0.01
  failed_permutation_replication_handling:
    at_or_below_limit: count_as_null_greater_than_or_equal_observed
    above_limit: evidence_insufficient
    denominator_remains_configured_replications_plus_one: true
    replacement_with_new_seed: forbidden

evaluation:
  primary_statistic: three_fold_three_horizon_equal_weight_macro_information_gain
  candidate_variants: [B2, B1]
  background_comparators: [B0, C0]
  primary_magnitude_bin: M5_6
  primary_magnitude_range: '[5.0,6.0)'
  unique_physical_event_union_minimum: 20
  independent_event_term_means: deduplicated_physical_event_id_not_statistical_independence
  cell_statistic:
    dimensions: fold_x_horizon
    fold_order: [1, 2, 3]
    horizon_order_days: [7, 30, 90]
    value: point_process_information_gain_nats_per_unique_physical_event
    minimum_unique_events_each_fold_horizon: 1
    zero_event_action: evidence_insufficient_no_partial_macro
  aggregation:
    fold_macro: arithmetic_mean_of_7_30_90_cell_information_gains
    overall_macro: arithmetic_mean_of_three_fold_macros
    equivalent_weight_per_fold_horizon_cell: 0.1111111111111111
    horizon_macro: arithmetic_mean_of_three_fold_cell_information_gains
    recall_aggregation: same_fold_then_overall_equal_weight_order
    null_replication_statistic: exact_same_overall_macro_after_refit
    bootstrap_statistic: exact_same_overall_macro_and_recall_after_joint_event_block_resample
    physical_event_block_shared_across_all_membership_cells: true
    exposure_compensators_fixed_in_bootstrap: true
  aggregation_reference_example:
    fold_rows_horizons_7_30_90:
      - [0.1, 0.2, 0.3]
      - [0.0, 0.1, 0.2]
      - [-0.1, 0.0, 0.1]
    expected_fold_macros: [0.2, 0.1, 0.0]
    expected_horizon_macros: [0.0, 0.1, 0.2]
    expected_overall_macro: 0.1
  horizon_point_estimate_must_be_positive: [7, 30, 90]
  fold_positive_count_minimum: 2
  fold_macro_median_must_be_positive: true
  macro_information_gain_familywise_simultaneous_95pct_lower_must_be_positive: true
  time_permutation_p_max: 0.05
  space_permutation_p_max: 0.05
  multiple_candidate_control:
    method: paired_single_step_maxT
    independent_null_families: [time_permutation, space_permutation]
    candidate_statistics:
      B1: overall_macro_ig_B1_minus_C0
      B2: overall_macro_ig_B2_minus_C0
    each_replication_family_statistic: max_of_B1_and_B2_candidate_statistics
    adjusted_p_formula: >-
      (1 + count(replication_family_max_gte_observed_candidate_statistic)) /
      (configured_replications + 1)
    required_for_adopted_candidate:
      - adjusted_time_permutation_p_lte_0_05
      - adjusted_space_permutation_p_lte_0_05
    B0_role: required_direction_ci_and_practical_comparator_not_in_candidate_maxT_family
    B2_minus_B1_role: component_adoption_gate_only_not_new_stage4a_positive
    unadjusted_candidate_p_values: diagnostic_only_not_gate
    B2_observed_invalid_handling:
      shrink_family_to_B1_only: forbidden
      B1_adoption_after_B2_invalid: forbidden
      overall_status: evidence_insufficient
      replacement_or_recompute: forbidden
  practical_improvement:
    pass_rule: fixed_600000_km2_recall_only
    same_area_strict_recall_gain_percentage_points_minimum: 5.0
    familywise_simultaneous_95pct_lower_must_be_positive: true
    required_against: [B0, C0]
    same_recall_union_area_relative_reduction:
      role: descriptive_only_not_pass_eligible
      reference_threshold: 0.10
  candidate_common_gate:
    required_candidate_comparator_pairs:
      - B1_minus_B0
      - B1_minus_C0
      - B2_minus_B0
      - B2_minus_C0
    required_against_each_of_B0_and_C0:
      - all_three_horizon_ig_point_estimates_positive
      - at_least_two_of_three_fold_macros_positive
      - three_fold_macro_median_positive
      - overall_macro_ig_familywise_simultaneous_95pct_lower_positive
      - fixed_600000km2_recall_gain_gte_5pp_and_familywise_simultaneous_95pct_lower_positive
      - regional_robustness
    required_once_per_candidate_for_anomaly_beyond_C0_maxT_family:
      - maxT_adjusted_time_permutation_p_lte_0_05
      - maxT_adjusted_space_permutation_p_lte_0_05
  dynamic_additional_gate:
    contrast: B2_minus_B1
    at_least_two_of_three_fold_macros_positive: true
    fold_macro_median_must_be_positive: true
    failure_action: reject_dynamic_only_then_evaluate_snapshot
  regional_robustness:
    minimum_event_bearing_regions: 2
    minimum_positive_event_bearing_regions: 2
    leave_strongest_contribution_region_out_macro_ig_must_be_positive: true
    leave_strongest_contribution_region_out_95pct_interval: required_diagnostic_not_gate
    raw_region_event_bindings_publication: forbidden
  full_study_area_target_denominator: true
  support_conditional_recall_is_diagnostic_only: true
  m6_plus:
    role: exploratory
    minimum_unique_physical_events_for_inference: 10

decision_gate:
  candidate_gate_applies_independently_to_B2_and_B1: true
  statuses: [passed, failed, evidence_insufficient, invalid]
  candidate_status_priority: [invalid, evidence_insufficient, failed, passed]
  candidate_truth_table:
    invalid:
      reasons:
        - candidate_fit_or_score_invalid
        - candidate_nonfinite_primary_output
      scientific_value_category: not_assigned_until_root_cause_review
    evidence_insufficient:
      reasons:
        - unique_physical_event_union_below_20
        - any_fold_horizon_has_zero_primary_events
        - required_bootstrap_interval_undefined
        - point_threshold_met_but_familywise_simultaneous_95pct_lower_includes_no_improvement
        - permutation_failed_fraction_above_0_01
        - fewer_than_two_event_bearing_regions
    failed:
      precondition: valid_and_evidence_sufficient
      reasons:
        - direction_or_fold_stability_gate_failed
        - either_permutation_p_above_0_05
        - fixed_area_5pp_practical_gate_failed
        - coverage_adjusted_gate_failed
        - regional_point_robustness_gate_failed
    passed:
      precondition: valid_evidence_sufficient_and_all_selected_candidate_gates_passed
  candidate_validity:
    B0_or_C0_invalid_action: overall_invalid
    B1_invalid_action: overall_invalid_because_snapshot_candidate_and_dynamic_reference_are_lost
    B2_invalid_action: overall_evidence_insufficient_no_candidate_adoption
    no_candidate_may_pass_with_nonfinite_or_failed_fit_score: true
  overall_status_resolution:
    shared_invalid_conditions:
      - leakage_or_target_derived_design
      - shared_input_support_grid_background_or_seal_identity_mismatch
      - nonfinite_shared_primary_output
      - B0_or_C0_fit_or_score_invalid
      - B1_invalid
    B2_only_invalid_action: overall_evidence_insufficient_no_candidate_adoption
    shared_invalid_precedes_candidate_adoption: true
    explicit_B2_only_invalid_cases:
      any_B1_status: overall_evidence_insufficient
    resolution_order:
      - any_shared_invalid_condition_means_overall_invalid
      - any_adopted_candidate_passes_means_overall_passed
      - no_adopted_candidate_and_any_evaluable_candidate_evidence_insufficient_or_B2_only_invalid_means_overall_evidence_insufficient
      - both_candidates_valid_evidence_sufficient_and_no_adopted_candidate_means_overall_failed
    nonselected_candidate_failed_status_cannot_override_adopted_pass: true
  adoption_matrix:
    - when_all:
        - B2_common_gate_passes
        - B2_minus_B1_dynamic_gate_passes
      selected_candidate: B2
      rejected_components: []
    - when_all:
        - B1_common_gate_passes
        - B2_status_is_not_invalid
        - B2_common_gate_or_B2_minus_B1_dynamic_gate_does_not_pass
      selected_candidate: B1
      rejected_components: [dynamic_trajectory]
    - when_all:
        - B1_common_gate_does_not_pass
        - no_candidate_is_adoptable
        - any_candidate_evidence_insufficient_or_B2_only_invalid
      selected_candidate: B0
      outcome: evidence_insufficient
    - when_all:
        - B1_and_B2_valid_and_evidence_sufficient
        - no_candidate_is_adoptable
      selected_candidate: B0
      outcome: failed
  passed:
    claim: development_rolling_signal_worth_one_independent_validation
    G2_or_G3_claim: forbidden
    science_value_category: direct_improvement
    evidence_scope: development_rolling_only
    decision: continue_to_target_blind_stage4b_protocol_only
  failed:
    science_value_category: no_material_progress
    decision: stop_anomaly_model_expansion_and_reassess
  evidence_insufficient:
    science_value_category: no_material_progress
    decision: stop_model_expansion_and_wait_for_new_mature_evidence_or_reassess
  invalid:
    science_value_category: not_assigned_until_root_cause_review
    decision: >-
      same_identity_infrastructure_resume_only_if_no_identity_or_code_change;
      otherwise_close_attempt_and_require_new_target_blind_protocol
  automatic_stop_on:
    - data_leakage
    - target_derived_grid_boundary_or_threshold
    - background_or_support_identity_mismatch
    - improvement_only_from_larger_alarm_area
    - improvement_only_in_one_fold_or_one_region
  changing_features_folds_area_thresholds_or_models_after_result: forbidden

execution_control:
  expected_input_manifest:
    path: data/manifests/anomaly_increment_kde_dev_input.json
    created_and_committed_at_code_tag: true
    generated_only_from_protocol_declared_identities_without_opening_real_inputs: true
    binds:
      - all_expected_input_paths_and_sha256
      - development_fold4_background_snapshot_identity
      - inherited_contract_allowlist_sha256
      - study_area_and_target_declared_sha256
  input_identity_seal:
    derivation: >-
      sha256(canonical_json(protocol_config_sha256,expected_input_manifest_sha256,
      environment_lock_sha256,source_commit))
    written_to_randomness_manifest_as_frozen_input_seal_sha256: true
  code_freeze_commit_graph:
    source_commit:
      identity_symbol: S
      contains_runner_scientific_modules_and_result_page_schemas: true
      score_blind_tests_pass_before_creation: true
    seal_commit:
      identity_symbol: C
      exact_parent: S
      allowed_changed_paths_from_S:
        - data/manifests/anomaly_increment_kde_dev_input.json
        - data/manifests/anomaly_increment_kde_dev_randomness.json
        - data/manifests/anomaly_increment_kde_dev_code_seal.json
        - data/manifests/anomaly_increment_kde_dev_attempt_ledger.json
      any_other_changed_path: forbidden
      self_commit_hash_embedded_in_tracked_tree: forbidden
    code_tag:
      name: v0.3.2-kde-anomaly-increment-code
      points_to: C
    preflight_remote_verification:
      - tag_peels_to_C
      - C_has_exactly_one_parent_S
      - C_minus_S_changed_paths_equal_allowed_changed_paths_from_S
      - source_tree_module_and_schema_hashes_match_code_seal
      - seal_artifact_cross_hashes_are_acyclic_and_match
  code_seal:
    path: data/manifests/anomaly_increment_kde_dev_code_seal.json
    created_and_committed_at_code_tag: true
    binds:
      - protocol_config_sha256
      - expected_input_manifest_sha256
      - frozen_input_seal_sha256
      - source_commit_S
      - expected_code_tag_name
      - exact_allowed_seal_commit_changed_paths
      - runner_and_scientific_module_sha256
      - environment_lock_sha256
      - randomness_manifest_sha256
      - initial_zero_attempt_ledger_sha256
      - result_and_page_schema_sha256
    must_not_bind:
      - seal_commit_C_hash
      - code_seal_own_sha256
  initial_attempt_ledger:
    path: data/manifests/anomaly_increment_kde_dev_attempt_ledger.json
    created_and_committed_at_code_tag_with_operation_count_zero: true
    append_only_hash_chain: true
    maximum_registered_scientific_attempts: 1
    initial_state: unregistered_zero_operations
    initial_zero_payload_binds:
      - protocol_config_sha256
      - expected_input_manifest_sha256
      - frozen_input_seal_sha256
      - source_commit_S
      - expected_code_tag_name
    initial_zero_payload_must_not_bind:
      - code_seal_sha256
      - seal_commit_C_hash
    registration: atomic_compare_and_swap_existing_zero_ledger_to_registered
    runtime_registration_appends_verified_code_seal_sha256: true
    missing_or_nonzero_initial_ledger_action: fail_closed
  runtime_target_read_ledger:
    path: data/interim/stage4/anomaly_increment_kde_dev/target_read_ledger.jsonl
    gitignored_local_only: true
    atomically_created_at_preflight_start_with_operation_count_zero: true
    append_only_hash_chain: true
    maximum_logical_target_open_sessions: 1
    records_metadata_and_hashes_not_target_rows: true
  preflight_receipt:
    path: data/interim/stage4/anomaly_increment_kde_dev/preflight_receipt.json
    requires_remote_code_tag_identity: true
    verifies_non_target_inputs_before_attempt_registration: true
    target_bytes_read_during_preflight: false
    binds_zero_target_read_ledger_sha256_and_operation_count: true
  attempt_start_sequence:
    - verify_remote_code_tag_and_code_seal
    - atomically_create_or_verify_same_identity_target_read_ledger_at_zero
    - write_preflight_receipt_bound_to_zero_target_read_ledger
    - verify_preflight_receipt_and_zero_target_read_count
    - atomically_register_single_attempt
    - verify_runtime_target_read_ledger_remains_zero_and_bound_to_preflight_receipt
    - open_target_once_through_single_adapter
  checkpoint_root: data/interim/stage4/anomaly_increment_kde_dev/checkpoints
  checkpoint_identity_fields:
    - protocol_sha256
    - code_seal_sha256
    - input_manifest_sha256
    - randomness_manifest_sha256
    - attempt_identity
  resume:
    same_identity_only: true
    completed_checkpoint_deletion_replacement_or_recompute: forbidden
    identity_or_code_change: close_invalid_and_require_new_target_blind_protocol
  result_manifest_must_record:
    - code_seal_sha256
    - final_attempt_ledger_sha256_and_operation_count
    - final_target_read_ledger_sha256_and_logical_open_count
    - completed_checkpoint_identity_set_sha256
  direct_target_reader_outside_single_adapter: forbidden

science_value_review:
  required_immediately_after_result: true
  required_fields:
    - science_value_category
    - evidence
    - decision
    - next_scientific_test
    - stop_condition
  engineering_proxies_cannot_establish_progress:
    - test_count
    - code_volume
    - interface_completeness
    - runtime_stability
  missing_review_blocks_stage_completion: true

resources:
  minimum_reserved_physical_cores: 2
  maximum_logical_workers: 6
  minimum_detected_physical_cores_to_run: 3
  effective_worker_formula: max(1,min(6,physical_cores-2))
  process_priority: below_normal
  blas_threads_per_process: 1
  receipt_must_record:
    - detected_physical_cores
    - detected_logical_processors
    - effective_workers
    - process_affinity
    - process_priority
    - OMP_NUM_THREADS
    - OPENBLAS_NUM_THREADS
    - MKL_NUM_THREADS
  gpu:
    allowed_only_if_numerically_equivalent_path_is_frozen_at_code_tag: true
    new_backend_engineering_for_this_gate: forbidden
    default: cpu_float64

outputs:
  result_manifest: data/manifests/anomaly_increment_kde_dev_result.json
  result_manifest_required_fields:
    - protocol_config_sha256
    - code_commit_tag_and_seal_sha256
    - input_manifest_sha256
    - randomness_manifest_sha256
    - attempt_and_target_read_ledger_hashes_and_counts
    - per_fold_horizon_exposure_event_and_unsupported_miss_counts
    - source_library_total_vs_attempt_used_snapshot_and_feature_row_counts_by_fold_with_unused_reason
    - B0_C0_B1_B2_metrics_confidence_intervals_and_placebos
    - familywise_simultaneous_95pct_IG_and_fixed_area_recall_bounds_with_marginal_diagnostic_labels
    - paired_maxT_adjusted_time_and_space_p_values_with_unadjusted_diagnostic_labels
    - candidate_gate_truth_table
    - selected_candidate_or_background
    - status_and_reason_codes
    - output_artifact_sha256
    - science_value_category
    - evidence
    - decision
    - next_scientific_test
    - stop_condition
  acceptance: docs/phase4_kde_development_acceptance.md
  static_science_summary: docs/anomaly_increment_kde_dev_results.svg
  public_interactive_forecast: outputs/interactive/anomaly_increment_kde_dev_forecast/index.html
  public_interactive_aggregate_results: outputs/interactive/anomaly_increment_kde_dev_results/index.html
  public_stage4a_index_files_immutable_after_result_tag: true
  local_full_fidelity_forecast: data/interim/stage4/anomaly_increment_kde_dev/forecast/index.html
  local_retrospective: data/interim/stage4/anomaly_increment_kde_dev/retrospective/index.html
  prospective_issue_root: outputs/prospective
  target_free_forecast_status_policy:
    applies_to:
      - public_target_free_forecast
      - local_full_fidelity_target_free_forecast
    passed: selected_B1_or_B2_primary_with_B0_optional_comparator
    failed_or_evidence_insufficient: B0_primary_B1_B2_default_off_and_labeled_not_adopted_diagnostic
    invalid: do_not_publish_forecast_page
  target_free_stage4a_pages_evidence_role: historical_or_development_replay_not_prospective_evidence
  prospective_issue_contract:
    activation: only_after_stage4a_result_tag_and_frozen_selected_or_B0_fallback_model
    issue_time_must_precede_target_window: true
    backfill: forbidden
    overwrite_or_delete_after_issue: forbidden
    required_identity_fields:
      - issue_id
      - issue_time_and_generation_time
      - data_cutoff_and_7_30_90_day_windows
      - input_manifest_sha256
      - model_identity_and_payload_sha256
      - protocol_config_sha256
      - code_commit_tag_and_seal_sha256
      - immutable_archive_path
    target_payload_hit_miss_or_future_event_count: forbidden
  schemas:
