science_question:
  plain_language: >-
    在历史地震多发区形成的75公里KDE底图上，加入截至起报日已经发布的动态异常，
    能否在相同报警面积内稳定覆盖更多未来经目录去重的物理地震事件，并且这种改善不能由报告覆盖变化、
    异常时间乱序或异常位置乱序解释？
  primary_magnitude_bin: M5_6
  primary_horizons_days: [7, 30, 90]
  primary_alarm_area_km2: 600000
  etas_status: not_evaluable_not_scored
  etas_absence_is_not_zero_score: true
  etas_scientific_value_rejection_forbidden: true

