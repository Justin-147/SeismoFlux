  unsupported_targets_never_enter_fit_or_future_scoring: true
  minimum_retained_area_fraction: 0.95

model:
  variant_id: etas/d25_q1.5_gamma1_cut300_kde_bw75
  background_kde_bandwidth_km: 75.0
  maximum_magnitude: 9.5
  spatial_kernel: {d_km2: 25.0, q: 1.5, gamma: 1.0, cutoff_km: 300.0}
  temporal_kernel: {history_parent_cutoff_days: 3650.0, form: normalized_infinite_support_omori_utsu}
  branching_ratio_maximum: 0.95
  parameter_order: [background_rate_per_day, productivity_k, alpha, c_days, p]
  transformed_parameter_order: [log_background_rate_per_day, log_productivity_k, log_alpha, log_c_days, log_p_minus_one]
  parameter_bounds:
    background_rate_per_day: [0.01, 10.0]
    productivity_k: [0.0001, 0.5]
    alpha: [0.05, 2.0]
    c_days: [0.001, 30.0]
    p: [1.01, 2.5]
  quadrature_grid_km: [50.0, 25.0, 12.5]

repair:
  only_existing_symbol_allowed_to_change: ETASParameterBounds.from_transformed
  defect: exp_log_physical_endpoint_may_decode_one_ulp_outside_frozen_bound
  method: exact_transformed_endpoint_to_exact_physical_endpoint
  require_strict_transformed_bounds_check: true
  forbidden: [clip, tolerance, widened_bounds, nextafter_expansion, changed_objective, changed_optimizer]

optimizer:
  method: L-BFGS-B
  root_seed: 147
  bit_generator: numpy.random.PCG64
  starts_per_snapshot: 5
  start_indices: [0, 1, 2, 3, 4]
  exact_start_manifest_required: true
  options: {ftol: 1.0e-12, gtol: 1.0e-6, maxiter: 500, maxfun: 100000, maxls: 20, gradient_relative_step: 1.0e-6}
  retry_with_new_seed: false
  replacement_start_allowed: false
  threshold_relaxation_after_result: false

qualification:
  exact_snapshot_count: 5
  exact_completed_start_row_count: 25
  all_five_snapshots_required: true
  minimum_converged_starts: 4
  gradient_infinity_norm_maximum: 1.0e-4
  best_three_relative_objective_range_maximum: 1.0e-4
  best_three_transformed_parameter_range_maximum: 0.1
  hessian_minimum_eigenvalue: 1.0e-8
  hessian_condition_number_maximum: 1.0e+10
  hessian_method: central_second_difference_of_objective_on_transformed_scale
  hessian_relative_step: 1.0e-4
  hessian_step_formula: relative_step_times_max_1_abs_parameter
  hessian_symmetrize: true
  hessian_invalid_stencil_action: fail_etas_stability_without_one_sided_substitution
  hessian_condition_number_definition: largest_eigenvalue_divided_by_smallest_eigenvalue_of_symmetric_positive_definite_hessian
  branching_ratio_maximum_exclusive: 0.95
  grid_25_to_12_5_expected_count_relative_difference_maximum: 0.02
  grid_25_to_12_5_density_l1_maximum: 0.05
  independent_recalculation_required: true
  result_is_evaluable_iff_every_snapshot_passes_every_gate: true

attempt:
  attempt_id: etas_qualification_q1
  root: data/interim/stage2/etas_numerical_qualification/attempts/etas_qualification_q1
  snapshot_result_path_template: snapshots/{snapshot_id}.json
  exactly_one_scientific_attempt: true
  automatic_retry: false
  fit_etas_call_count_per_missing_snapshot: 1
  snapshot_result_contains_all_five_start_rows: true
  snapshot_result_write: same_directory_temporary_file_then_atomic_create_if_absent
  completed_snapshot_result_is_immutable: true
  interrupted_attempt_may_fill_missing_snapshot_only: true
  interrupted_in_memory_fit_without_snapshot_result_is_not_a_completed_scientific_result: true
  resumed_missing_snapshot_reuses_identical_input_hash_and_five_start_vectors: true
  completed_start_row_replacement: false
  final_result_create_once: true
  positive_or_negative_result_must_be_published: true

resources:
  max_workers: 1
  blas_threads: 1
  reserve_physical_cores_minimum: 2
  do_not_start_if_system_cpu_percent_gte: 70
  gpu_required: false
  gpu_note: current_scipy_lbfgsb_path_is_cpu_bound

outputs:
  input_manifest: data/manifests/etas_numerical_qualification_input.json
  result_manifest: data/manifests/etas_numerical_qualification_result.json
  verification_manifest: data/manifests/etas_numerical_qualification_verification.json
  report: docs/background_etas_numerical_qualification_report.md
  static_figure: docs/background_etas_numerical_qualification_diagnostic.svg
  interactive_report: outputs/interactive/background_etas_numerical_qualification/index.html
  required_public_fields:
    [snapshot_id, scientific_fit_input_sha256, start_index, initial_transformed_hex, terminal_transformed_hex, terminal_physical_parameters_hex, numerical_status, objective, gradient_infinity_norm, iterations, function_evaluations, gate_name, gate_status, failure_code]
  public_forbidden_fields: [physical_event_id, longitude, latitude, absolute_local_path, anomaly_feature, target_label, score]
  input_manifest_binds:
    [protocol_config_sha256, code_commit, code_tag, catalog_sha256, study_area_sha256, support_manifest_sha256, start_manifest_sha256, snapshot_membership_sha256, maximum_origin_time, maximum_available_at]
  result_manifest_binds:
    [attempt_id, input_manifest_sha256, protocol_config_sha256, code_commit, code_tag, python_version, numpy_version, scipy_version, snapshot_results_sha256, qualification_status]
  verification_recomputes:
    [physical_parameters, objective, gradient, best_three, hessian, branching_ratio, three_grid_metrics, unsupported_parent_objective_sensitivity, snapshot_status, qualification_status]
  verification_must_rebuild_inputs_and_not_trust_derived_result_metrics: true
  evaluable_only_parameter_snapshots: true

decision:
  evaluable:
    - freeze_five_parameter_snapshots
    - integrate_same_support_uniform_kde_etas_comparison
    - publish_target_blind_stage4_execution_amendment_before_any_target_read
  not_evaluable:
    - publish_credible_numerical_insufficiency
    - retain_kde_as_reproducible_non_anomaly_background
    - do_not_read_stage4_targets
    - stop_etas_candidate_iteration
    - do_not_enter_deep_model_or_locked_test
