<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stage 2S-1 正式尝试停止流程</title>
  <desc id="desc">协议和代码标签身份核验、无目标预检、目录解析与 fold4 重建完成；主科学路径随后发生未留存异常，terminal finalizer 的双编码缺陷覆盖原异常，因此没有评分结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #0f172a; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 46px; font-weight: 600; }
      .subtitle { fill: #475569; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 24px; }
      .label { fill: #0f172a; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 24px; font-weight: 600; text-anchor: middle; }
      .note { fill: #475569; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 19px; text-anchor: middle; }
      .symbol { fill: #0f172a; font-family: "Microsoft YaHei", sans-serif; font-size: 34px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .pass { fill: #d1fae5; stroke: #059669; stroke-width: 4; }
      .used { fill: #fef3c7; stroke: #d97706; stroke-width: 4; }
      .stop { fill: #fee2e2; stroke: #dc2626; stroke-width: 5; }
      .none { fill: #e2e8f0; stroke: #64748b; stroke-width: 4; }
      .line { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
      .banner { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; rx: 18; }
      .banner-title { fill: #991b1b; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 30px; font-weight: 700; text-anchor: middle; }
      .banner-note { fill: #7f1d1d; font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 22px; text-anchor: middle; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="90" y="90">Stage 2S-1：唯一正式尝试在评分前停止</text>
  <text class="subtitle" x="90" y="135">没有形成模型成绩；不能把实现失败解释成预测方法的正面或负面证据</text>

  <path class="line" d="M250 290 H410"/>
  <path class="line" d="M590 290 H750"/>
  <path class="line" d="M930 290 H1090"/>
  <path class="line" d="M1190 355 V460 H1110 V485"/>
  <path class="line" d="M1045 560 H870"/>
  <path class="line" d="M730 560 H555"/>

  <g transform="translate(170 290)">
    <circle class="pass" r="64"/>
    <text class="symbol" y="4">✓</text>
    <text class="label" y="112">协议/代码标签</text>
    <text class="note" y="145">身份核验通过</text>
  </g>

  <g transform="translate(510 290)">
    <circle class="pass" r="64"/>
    <text class="symbol" y="4">✓</text>
    <text class="label" y="112">无目标预检</text>
    <text class="note" y="145">格网、区域、输入身份通过</text>
  </g>

  <g transform="translate(850 290)">
    <circle class="used" r="64"/>
    <text class="symbol" y="4">!</text>
    <text class="label" y="112">attempt + target read</text>
    <text class="note" y="145">已封存、已消费</text>
  </g>

  <g transform="translate(1190 290)">
    <circle class="pass" r="64"/>
    <text class="symbol" y="4">✓</text>
    <text class="label" y="112">目录解析 + fold4</text>
    <text class="note" y="145">真实目录单次读取后通过</text>
  </g>

  <g transform="translate(1110 560)">
    <circle class="stop" r="64"/>
    <text class="symbol" y="4">×</text>
    <text class="label" y="112">主科学路径异常</text>
    <text class="note" y="145">原始原因未留存</text>
  </g>

  <g transform="translate(800 560)">
    <circle class="stop" r="64"/>
    <text class="symbol" y="4">×</text>
    <text class="label" y="112">terminal finalizer</text>
    <text class="note" y="145">双编码 P0 覆盖原异常</text>
  </g>

  <g transform="translate(490 560)">
    <circle class="none" r="64"/>
    <text class="symbol" y="4">—</text>
    <text class="label" y="112">评分与效果图</text>
    <text class="note" y="145">未发生</text>
  </g>

  <rect class="banner" x="180" y="740" width="1240" height="110"/>
  <text class="banner-title" x="800" y="785">科学结论：无结果，不是负结果；Stage 2S 停止</text>
  <text class="banner-note" x="800" y="825">保留长期 75 km KDE；先做目标盲路线复审，禁止修复后重跑本次目标</text>
</svg>
