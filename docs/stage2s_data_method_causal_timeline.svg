<rect x="60" y="335" width="305" height="150" rx="16" class="blue"/>
<text x="82" y="370" class="cardTitle">S0｜长期背景</text>
<text x="82" y="402" class="body">fold_4；训练截止</text>
<text x="82" y="425" class="body">2019-12-31T16:00:00Z</text>
<text x="82" y="448" class="body">75 km 等面积 Gaussian KDE</text>
<text x="82" y="471" class="body">授权后从同一目录 bytes 精确重物化</text>
<rect x="390" y="335" width="305" height="150" rx="16" class="green"/>
<text x="412" y="370" class="cardTitle">R｜最近窗口</text>
<text x="412" y="402" class="body">M4+；(T-30d,T]</text>
<text x="412" y="427" class="body">available_at ≤ T</text>
<text x="412" y="452" class="body">75 km；等权；无时间衰减</text>
<rect x="720" y="335" width="305" height="150" rx="16" class="orange"/>
<text x="742" y="370" class="cardTitle">RP｜紧邻过去对照</text>
<text x="742" y="402" class="body">M4+；(T-60d,T-30d]</text>
<text x="742" y="427" class="body">available_at ≤ T−30d</text>
<text x="742" y="452" class="body">75 km；与 R 同结构</text>
<rect x="1050" y="335" width="490" height="150" rx="16" class="purple"/>
<text x="1072" y="370" class="cardTitle">三模型共享折内 M5–6 日率</text>
<text x="1072" y="402" class="body">S1 = (1-alpha_R_fold)*S0 + alpha_R_fold*R</text>
<text x="1072" y="427" class="body">SP = (1-alpha_P_fold)*S0 + alpha_P_fold*RP</text>
<text x="1072" y="452" class="body">alpha_R_fold / alpha_P_fold / r_M5_6_fold：本图无数值</text>
<text x="60" y="535" class="section">目标盲日历：fold 1 → 2 → 3；每折权重共享 7/30/90 天；完整前缀 ≤ 600,000 km²</text>
