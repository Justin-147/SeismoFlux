  </g>
  <g id="text_30">
   <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #536775" transform="translate(34.02 568.761398)">断层资料为 2026 年收集快照：仅检验对历史地点分布的补充信息，不代表当时可发布的预测，也不是真正前瞻检验。</text>
   <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #536775" transform="translate(34.02 583.162277)">各时限／震级分别评价；不合并扩大独立样本。相对空间分配不是绝对发震概率。</text>
   <text style="font-size: 9px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #536775" transform="translate(34.02 597.528)">同一报警预算，实际完整格面积略有差异；粗化保留既定大区总质量，不是空间置乱或迁移检验。</text>
  </g>
